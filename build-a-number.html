<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔟 Build a Number!</title>
<style>
:root { color-scheme: light; }
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
body { font-family:'Comic Sans MS','Trebuchet MS',sans-serif; background:linear-gradient(180deg,#fff3d1,#ffd98a); color:#333; text-align:center; padding:10px; min-height:100vh; }
nav { background:rgba(255,255,255,0.7); padding:10px; margin:0 auto 14px; border-radius:12px; max-width:820px; }
nav a { text-decoration:none; color:#a76a00; margin-right:16px; font-weight:bold; }
h1 { font-size:1.7em; color:#d65a00; text-shadow:0 2px 0 #fff8; }
.subtitle { color:#7a5a30; margin:4px 0 10px; font-size:0.95em; }

.modes { display:flex; gap:8px; justify-content:center; margin:10px 0 14px; flex-wrap:wrap; }
.mode-btn { border:none; border-radius:14px; padding:10px 16px; font-weight:bold; cursor:pointer; font-family:inherit; background:#fff; color:#a76a00; box-shadow:0 3px 0 #c98a3a; font-size:1em; }
.mode-btn.active { background:#ff9a3d; color:#fff; box-shadow:0 3px 0 #d65a00; }

.panel { background:#fffaf0; border:3px solid #ffc266; border-radius:22px; padding:14px; max-width:820px; margin:0 auto 14px; box-shadow:0 6px 0 #f0b04a; }
.target { font-size:1.6em; font-weight:bold; color:#d65a00; margin-bottom:6px; }
.target span { font-size:1.6em; color:#3a7c2c; }

.workspace { min-height:140px; background:#fff8e1; border:2px dashed #ffc266; border-radius:16px; padding:14px 12px 10px; display:flex; flex-wrap:wrap; align-items:flex-end; gap:8px; justify-content:center; }

.total { font-size:1.35em; color:#3a7c2c; font-weight:bold; margin-top:10px; }
.total.over span { color:#c33; }
.total.match span { color:#3a7c2c; }

.tray { display:flex; gap:10px; justify-content:center; margin:12px 0 4px; flex-wrap:wrap; align-items:center; }
.tray button { border:none; border-radius:14px; padding:12px 16px; font-weight:bold; cursor:pointer; font-family:inherit; font-size:1.1em; box-shadow:0 3px 0 #0003; transition:transform 0.08s; }
.tray button:active { transform:translateY(2px); box-shadow:0 1px 0 #0003; }
.add-10 { background:#ff7a55; color:#fff; }
.add-5  { background:#ffd24d; color:#5a3a00; }
.add-1  { background:#5ab4ff; color:#fff; }
.clear-btn { background:#eee; color:#666; }

/* Block visuals */
.block { display:inline-block; vertical-align:bottom; cursor:pointer; user-select:none; transition:transform 0.18s, opacity 0.18s; }
.block:hover { transform:translateY(-3px); }
.b-10 { width:24px; height:120px; background:linear-gradient(180deg,#ff8866,#e85530); border-radius:6px; position:relative; box-shadow:inset 0 0 0 2px #c43818, 0 3px 0 #8a2a0e; }
.b-10::before { content:''; position:absolute; left:4px; right:4px; top:6px; bottom:6px; background:repeating-linear-gradient(180deg, #ffffff55 0 1px, transparent 1px 11.4px); border-radius:3px; }
.b-5 { width:24px; height:62px; background:linear-gradient(180deg,#ffd24d,#e6a720); border-radius:6px; position:relative; box-shadow:inset 0 0 0 2px #b07a10, 0 3px 0 #8a5a08; }
.b-5::before { content:''; position:absolute; left:4px; right:4px; top:6px; bottom:6px; background:repeating-linear-gradient(180deg, #ffffff55 0 1px, transparent 1px 11.5px); border-radius:3px; }
.b-1 { width:24px; height:24px; background:radial-gradient(circle at 35% 30%,#cce8ff,#5ab4ff); border-radius:50%; box-shadow:0 2px 0 #2a7ec0; }
.bundle-in { animation:pop 0.45s; }
@keyframes pop { 0%{transform:scale(1.5) rotate(-6deg); filter:brightness(1.6);} 60%{transform:scale(0.95);} 100%{transform:scale(1) rotate(0);} }

.feedback { font-size:1.15em; font-weight:bold; min-height:1.4em; margin-top:10px; color:#3a7c2c; }

/* Add mode */
.add-eq { font-size:1.8em; font-weight:bold; color:#d65a00; margin:6px 0 10px; }
.add-rows { display:flex; flex-direction:column; gap:12px; }
.add-row { background:#fff8e1; border:2px dashed #ffc266; border-radius:16px; padding:10px; }
.row-label { font-size:1.1em; font-weight:bold; color:#a76a00; margin-bottom:6px; }
.combine-btn { margin-top:10px; background:#9a6dff; color:#fff; border:none; border-radius:14px; padding:12px 22px; font-weight:bold; cursor:pointer; font-family:inherit; font-size:1.15em; box-shadow:0 3px 0 #6b3fcf; }
.combine-btn:disabled { opacity:0.4; cursor:not-allowed; }
.next-btn { margin-top:8px; background:#3a7c2c; color:#fff; border:none; border-radius:14px; padding:10px 18px; font-weight:bold; cursor:pointer; font-family:inherit; font-size:1em; box-shadow:0 3px 0 #1f5414; }

.decomposition { margin:14px 0 6px; font-size:1.15em; color:#7a5a30; line-height:1.9; }
.dec-line { margin:4px 0; }
.dec-tens { display:inline-block; background:#ffd0c0; color:#c43818; padding:3px 10px; border-radius:10px; margin:0 2px; font-weight:bold; }
.dec-ones { display:inline-block; background:#cfe5ff; color:#1f6ec0; padding:3px 10px; border-radius:10px; margin:0 2px; font-weight:bold; }
.dec-answer { font-size:1.5em; font-weight:bold; color:#3a7c2c; margin-top:8px; }
.combined-row { background:#f1ffe6; border:2px solid #a8d98a; }
.regroup-note { color:#9a6dff; font-weight:bold; }

.confetti { position:fixed; top:-20px; font-size:1.5em; pointer-events:none; z-index:99; animation:fall 2.4s linear forwards; }
@keyframes fall { to { transform:translateY(110vh) rotate(540deg); opacity:0; } }

/* Zoo */
.chip { display:inline-block; background:rgba(255,255,255,0.85); border:2px solid #ffc266; border-radius:16px; padding:6px 14px; font-weight:bold; margin:0 4px 4px; color:#a76a00; }
.chip.coin-pop { animation:coinpop 0.5s; }
@keyframes coinpop { 0%{transform:scale(1);} 50%{transform:scale(1.25); background:#fff3b0;} 100%{transform:scale(1);} }
.zoo-name { font-size:1.4em; color:#a76a00; margin:6px 0; font-weight:bold; }
#zoo { width:100%; max-width:760px; height:380px; background:linear-gradient(180deg,#cdeeff 0%, #cdeeff 55%, #84cf6e 55%, #4ba83a 100%); border-radius:18px; cursor:crosshair; display:block; touch-action:none; margin:0 auto; border:3px solid #ffc266; }
.tools { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:10px; }
.tool { border:none; border-radius:14px; padding:8px 14px; font-weight:bold; cursor:pointer; font-family:inherit; background:#fff; color:#a76a00; box-shadow:0 2px 0 #c98a3a; font-size:0.95em; }
.tool.active { background:#ff7a55; color:#fff; box-shadow:0 2px 0 #c43818; }
.sticker-shelf { margin-top:14px; }
.shelf-title { font-size:0.95em; color:#7a5a30; margin-bottom:6px; }
.stickers { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; }
.sticker { position:relative; font-size:1.7em; background:rgba(255,200,100,0.2); border:2px solid transparent; border-radius:12px; padding:6px 8px; cursor:pointer; font-family:inherit; transition:transform 0.1s; }
.sticker:hover { transform:translateY(-2px); }
.sticker .badge { position:absolute; top:-6px; right:-6px; background:#ff9a3d; color:#fff; font-size:0.45em; font-weight:bold; border-radius:10px; padding:2px 6px; }
.sticker.locked { opacity:0.3; cursor:not-allowed; }
.sticker.locked:hover { transform:none; }
.sticker.selected { border-color:#ff7a55; background:#fff3b0; }
.nameRow { margin-top:12px; display:flex; gap:6px; justify-content:center; flex-wrap:wrap; }
.nameRow input { font-family:inherit; font-size:1em; border-radius:12px; border:2px solid #ffc266; padding:8px 12px; min-width:140px; }
.bigbtn { border:none; border-radius:12px; padding:9px 16px; font-weight:bold; cursor:pointer; font-family:inherit; background:#ff9a3d; color:#fff; font-size:0.95em; box-shadow:0 3px 0 #d65a00; }
.bigbtn.danger { background:#c66; box-shadow:0 3px 0 #833; }
.coin-fly { position:fixed; font-size:1.4em; pointer-events:none; z-index:98; animation:coinfly 1.2s ease-out forwards; }
@keyframes coinfly { 0%{transform:translateY(0) scale(1); opacity:1;} 100%{transform:translateY(-80px) scale(1.4); opacity:0;} }

.legend { display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin:8px 0 0; font-size:0.9em; color:#7a5a30; }
.legend span { display:inline-flex; align-items:center; gap:6px; }
.legend .swatch { display:inline-block; width:14px; height:14px; border-radius:3px; }
.legend .sw10 { background:#e85530; height:22px; width:8px; }
.legend .sw5 { background:#e6a720; height:14px; width:8px; }
.legend .sw1 { background:#5ab4ff; border-radius:50%; width:12px; height:12px; }
</style>
</head>
<body>
<nav>
  <a href="index.html">← Home</a>
</nav>
<h1>🔟 Build a Number!</h1>
<div class="subtitle">Stack tens, fives, and ones to make a number — then add another to it!</div>
<div style="text-align:center;"><span class="chip coins" id="coinChip">🪙 Coins: <span id="coins">0</span></span></div>

<!-- BUILD MODE -->
<div class="panel" id="buildPanel">
  <div class="target">Make <span id="target">47</span></div>
  <div class="workspace" id="ws"></div>
  <div class="total">So far: <span id="total">0</span></div>
  <div class="tray">
    <button class="add-10" data-v="10">+10</button>
    <button class="add-5"  data-v="5">+5</button>
    <button class="add-1"  data-v="1">+1</button>
    <button class="clear-btn" id="clearBtn">Clear</button>
  </div>
  <div class="legend">
    <span><span class="swatch sw10"></span>ten</span>
    <span><span class="swatch sw5"></span>five</span>
    <span><span class="swatch sw1"></span>one</span>
    <span>tap a block to remove it</span>
  </div>
  <div class="feedback" id="feedback"></div>
</div>

<!-- ADD MODE -->
<div class="panel" id="addPanel" style="display:none;">
  <div class="add-eq" id="addEq">47 + 28 = ?</div>
  <div class="add-rows">
    <div class="add-row">
      <div class="row-label"><span id="addAPrefix">You built</span> <span id="addA">47</span></div>
      <div class="workspace" id="wsA"></div>
      <div class="total">So far: <span id="totalA">0</span></div>
    </div>
    <div class="add-row">
      <div class="row-label"><span id="addBPrefix">Now build</span> <span id="addB">28</span></div>
      <div class="workspace" id="wsB"></div>
      <div class="total">So far: <span id="totalB">0</span></div>
      <div class="tray">
        <button class="add-10" data-side="B" data-v="10">+10</button>
        <button class="add-5"  data-side="B" data-v="5">+5</button>
        <button class="add-1"  data-side="B" data-v="1">+1</button>
        <button class="clear-btn" data-side="B" data-clear="1">Clear</button>
      </div>
    </div>
    <div class="add-row combined-row" id="combinedRow" style="display:none;">
      <div class="row-label">All together</div>
      <div class="workspace" id="wsC"></div>
    </div>
  </div>
  <button class="combine-btn" id="combineBtn" disabled>✨ Combine!</button>
  <div class="decomposition" id="dec"></div>
  <button class="next-btn" id="nextBtn" style="display:none;">Next problem →</button>
</div>

<!-- ZOO -->
<div class="panel">
  <div class="zoo-name" id="zooName">My Zoo 🦁</div>
  <canvas id="zoo" width="700" height="380"></canvas>
  <div class="tools">
    <button class="tool active" data-tool="place">📍 Place</button>
    <button class="tool" data-tool="move">✋ Move</button>
    <button class="tool" data-tool="erase">🧽 Erase</button>
  </div>
  <div class="sticker-shelf">
    <div class="shelf-title">Earn coins from math problems to unlock animals! 👇</div>
    <div class="stickers" id="stickers"></div>
  </div>
  <div class="nameRow">
    <input id="nameInput" placeholder="Name your zoo..." maxlength="22">
    <button class="bigbtn" id="nameBtn">Save Name</button>
    <button class="bigbtn danger" id="clearZoo">Clear Zoo</button>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const sum=arr=>arr.reduce((s,v)=>s+v,0);

// ---------- shared block rendering ----------
function blockEl(v, onClick, animate){
  const d=document.createElement('div');
  d.className='block b-'+v + (animate?' bundle-in':'');
  if(onClick) d.onclick=onClick;
  return d;
}

// Bundle ten 1s into a 10 and two 5s into a 10. Returns the last bundle message or ''.
function autoBundle(arr){
  let msg='';
  // ones -> 10
  while(arr.filter(x=>x===1).length>=10){
    let removed=0;
    for(let i=arr.length-1;i>=0 && removed<10;i--){
      if(arr[i]===1){ arr.splice(i,1); removed++; }
    }
    arr.push(10);
    msg='Ten ones bundled into a 10! 🎉';
  }
  // fives -> 10
  while(arr.filter(x=>x===5).length>=2){
    let removed=0;
    for(let i=arr.length-1;i>=0 && removed<2;i--){
      if(arr[i]===5){ arr.splice(i,1); removed++; }
    }
    arr.push(10);
    msg='Two fives bundled into a 10! 🎉';
  }
  return msg;
}

// ---------- BUILD MODE ----------
let target=0;
let blocks=[];
let lastBundle='';

function newTarget(){
  target = 11 + rnd(89);
  $('target').textContent=target;
  blocks=[];
  $('feedback').textContent='';
  render();
}

function render(){
  const ws=$('ws'); ws.innerHTML='';
  const sorted=[...blocks].sort((a,b)=>b-a);
  sorted.forEach((v,i)=>{
    const animate = (lastBundle && v===10 && i===sorted.indexOf(10));
    ws.appendChild(blockEl(v, ()=>removeBlock(v), animate));
  });
  lastBundle='';
  const total=sum(blocks);
  $('total').innerHTML='So far: <span>'+total+'</span>';
  $('total').classList.toggle('over', total>target);
  $('total').classList.toggle('match', total===target);
  if(total===target) celebrate();
}

function addBlock(v){
  blocks.push(v);
  const msg=autoBundle(blocks);
  if(msg){ lastBundle=msg; flashBundle(msg); }
  render();
}

function removeBlock(v){
  const i=blocks.lastIndexOf(v);
  if(i>=0){ blocks.splice(i,1); render(); }
}

function flashBundle(msg){
  $('feedback').textContent=msg;
  $('feedback').style.color='#9a6dff';
  setTimeout(()=>{ if($('feedback').textContent===msg) $('feedback').textContent=''; }, 1400);
}

let celebrating=false;
function celebrate(){
  if(celebrating) return;
  celebrating=true;
  awardCoins(2, $('target'));
  $('feedback').textContent='✅ '+target+'! +2 🪙  Now let\'s add to it...';
  $('feedback').style.color='#3a7c2c';
  confetti();
  setTimeout(()=>{ celebrating=false; goToAdd(); }, 1600);
}

function goToAdd(){
  aTarget = target;
  aBlocks = [...blocks];
  // pick a second addend that's reasonable and varied
  bTarget = 13 + rnd(60); // 13..72
  $('addA').textContent=aTarget;
  $('addB').textContent=bTarget;
  $('addEq').textContent=aTarget+' + '+bTarget+' = ?';
  $('addAPrefix').textContent='You built';
  $('addBPrefix').textContent='Now build';
  bBlocks=[];
  combined=false;
  $('dec').innerHTML='';
  $('combinedRow').style.display='none';
  $('nextBtn').style.display='none';
  $('combineBtn').style.display='';
  $('combineBtn').disabled=true;
  renderAdd();
  $('buildPanel').style.display='none';
  $('addPanel').style.display='';
}

function goToBuild(){
  $('addPanel').style.display='none';
  $('buildPanel').style.display='';
  newTarget();
}

document.querySelectorAll('#buildPanel .tray button[data-v]').forEach(b=>{
  b.onclick=()=>addBlock(+b.dataset.v);
});
$('clearBtn').onclick=()=>{ blocks=[]; render(); };

// ---------- ADD MODE ----------
let aTarget=0, bTarget=0;
let aBlocks=[], bBlocks=[];
let combined=false;

function renderSide(side){
  const ws = side==='A'?$('wsA'):$('wsB');
  const totalEl = side==='A'?$('totalA'):$('totalB');
  const targetN = side==='A'?aTarget:bTarget;
  const arr = side==='A'?aBlocks:bBlocks;
  ws.innerHTML='';
  [...arr].sort((a,b)=>b-a).forEach(v=>{
    ws.appendChild(blockEl(v, ()=>{
      const i=arr.lastIndexOf(v); if(i>=0){ arr.splice(i,1); renderSide(side); checkReady(); }
    }));
  });
  const t=sum(arr);
  totalEl.innerHTML='So far: <span>'+t+'</span>';
  totalEl.classList.toggle('over', t>targetN);
  totalEl.classList.toggle('match', t===targetN);
}

function renderAdd(){ renderSide('A'); renderSide('B'); checkReady(); }

function addSide(side,v){
  const arr = side==='A'?aBlocks:bBlocks;
  arr.push(v);
  autoBundle(arr);
  renderSide(side);
  checkReady();
}

function checkReady(){
  $('combineBtn').disabled = combined || sum(aBlocks)!==aTarget || sum(bBlocks)!==bTarget;
}

document.querySelectorAll('#addPanel .tray button[data-v]').forEach(b=>{
  b.onclick=()=>addSide(b.dataset.side, +b.dataset.v);
});
document.querySelectorAll('#addPanel .tray button[data-clear]').forEach(b=>{
  b.onclick=()=>{ const side=b.dataset.side; if(side==='A')aBlocks=[]; else bBlocks=[]; renderSide(side); checkReady(); };
});

$('combineBtn').onclick=()=>{
  if(combined) return;
  combined=true;
  $('combineBtn').style.display='none';

  // Combined visual: all blocks together, sorted big-to-small
  const all=[...aBlocks, ...bBlocks];
  autoBundle(all); // bundles cross-row pairs too (e.g. one 5 from each row)
  const wsC=$('wsC'); wsC.innerHTML='';
  [...all].sort((a,b)=>b-a).forEach(v=>wsC.appendChild(blockEl(v, null, false)));
  $('combinedRow').style.display='';

  // Decomposition text
  const aTens=Math.floor(aTarget/10)*10, aOnes=aTarget-aTens;
  const bTens=Math.floor(bTarget/10)*10, bOnes=bTarget-bTens;
  const sumTens=aTens+bTens, sumOnes=aOnes+bOnes;
  const total=aTarget+bTarget;

  let html='';
  html+='<div class="dec-line">'+aTarget+' + '+bTarget+'</div>';
  html+='<div class="dec-line">= (<span class="dec-tens">'+aTens+'</span> + <span class="dec-ones">'+aOnes+'</span>) + (<span class="dec-tens">'+bTens+'</span> + <span class="dec-ones">'+bOnes+'</span>)</div>';
  html+='<div class="dec-line">= <span class="dec-tens">'+aTens+'</span> + <span class="dec-tens">'+bTens+'</span> + <span class="dec-ones">'+aOnes+'</span> + <span class="dec-ones">'+bOnes+'</span></div>';
  html+='<div class="dec-line">= <span class="dec-tens">'+sumTens+'</span> + <span class="dec-ones">'+sumOnes+'</span></div>';

  if(sumOnes>=10){
    const newOnes=sumOnes-10, newTens=sumTens+10;
    html+='<div class="dec-line regroup-note">('+sumOnes+' ones = 1 ten + '+newOnes+' ones)</div>';
    html+='<div class="dec-line">= <span class="dec-tens">'+newTens+'</span> + <span class="dec-ones">'+newOnes+'</span></div>';
  }
  const reward = 3 + (sumOnes>=10?1:0);
  html+='<div class="dec-answer">= '+total+' 🎉  +'+reward+' 🪙</div>';
  $('dec').innerHTML=html;

  awardCoins(reward, $('combineBtn'));
  confetti();
  $('nextBtn').style.display='';
};

$('nextBtn').onclick=()=>goToBuild();

function confetti(){
  const e=['🎉','⭐','🌟','💫','✨','🔟','🧮'];
  for(let i=0;i<14;i++){
    const c=document.createElement('div');
    c.className='confetti';
    c.textContent=pick(e);
    c.style.left=rnd(100)+'vw';
    c.style.animationDelay=(Math.random()*0.4)+'s';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(), 2800);
  }
}

// ---------- ZOO ----------
let coins=0;
let zooItems=[];      // {e, x, y}
let zooName='My Zoo 🦁';
let selectedAnimal='🐭';
let zooTool='place';
let dragItem=null;

const animals=[
  // Tier 1 — start with these unlocked
  {e:'🐭',cost:1},{e:'🐹',cost:1},{e:'🐰',cost:1},{e:'🐤',cost:1},{e:'🐢',cost:1},{e:'🐸',cost:1},{e:'🐟',cost:1},
  // Tier 2 — pets
  {e:'🐶',cost:3},{e:'🐱',cost:3},{e:'🐷',cost:3},{e:'🐮',cost:3},{e:'🐔',cost:3},{e:'🦆',cost:3},
  // Tier 3 — forest
  {e:'🦊',cost:6},{e:'🐻',cost:6},{e:'🐨',cost:6},{e:'🐼',cost:6},{e:'🐧',cost:6},{e:'🦉',cost:6},
  // Tier 4 — wild
  {e:'🦁',cost:10},{e:'🐯',cost:10},{e:'🐺',cost:10},{e:'🦝',cost:10},{e:'🐊',cost:10},
  // Tier 5 — safari
  {e:'🐘',cost:15},{e:'🦒',cost:15},{e:'🦓',cost:15},{e:'🦛',cost:15},{e:'🐪',cost:15},{e:'🦏',cost:15},
  // Tier 6 — legendary
  {e:'🦄',cost:25},{e:'🐉',cost:25},{e:'🦖',cost:40}
];

function loadZoo(){
  try{
    const s=JSON.parse(localStorage.getItem('kochitty.zoo')||'{}');
    if(typeof s.coins==='number') coins=s.coins;
    if(Array.isArray(s.items)) zooItems=s.items;
    if(typeof s.name==='string' && s.name) zooName=s.name;
    if(typeof s.selected==='string' && s.selected) selectedAnimal=s.selected;
  }catch(e){}
}
function saveZoo(){
  try{ localStorage.setItem('kochitty.zoo', JSON.stringify({coins, items:zooItems, name:zooName, selected:selectedAnimal})); }catch(e){}
}

function awardCoins(n, anchorEl){
  coins += n;
  $('coins').textContent=coins;
  const chip=$('coinChip');
  chip.classList.remove('coin-pop'); void chip.offsetWidth; chip.classList.add('coin-pop');
  renderStickers();
  saveZoo();
  // flying coins from the source toward the chip
  if(anchorEl){
    const r=anchorEl.getBoundingClientRect();
    for(let i=0;i<Math.min(n,5);i++){
      const f=document.createElement('div');
      f.className='coin-fly'; f.textContent='🪙';
      f.style.left=(r.left + r.width/2 + (rnd(40)-20))+'px';
      f.style.top=(r.top + r.height/2)+'px';
      f.style.animationDelay=(i*0.08)+'s';
      document.body.appendChild(f);
      setTimeout(()=>f.remove(), 1400);
    }
  }
}

function renderStickers(){
  const box=$('stickers'); box.innerHTML='';
  animals.forEach(a=>{
    const b=document.createElement('button');
    const afford = coins >= a.cost;
    b.className='sticker' + (afford?'':' locked') + (a.e===selectedAnimal?' selected':'');
    b.innerHTML=a.e+'<span class="badge">🪙'+a.cost+'</span>';
    b.title = afford ? 'Tap to use this animal' : 'Need '+a.cost+' coins';
    b.onclick=()=>{
      if(coins >= a.cost){ selectedAnimal=a.e; renderStickers(); saveZoo(); }
    };
    box.appendChild(b);
  });
}

// Canvas
const zoo=$('zoo'), zx=zoo.getContext('2d');
const ZW=zoo.width, ZH=zoo.height;

function pos(e){
  const r=zoo.getBoundingClientRect();
  const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
  const cy=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
  return {x:cx/r.width*ZW, y:cy/r.height*ZH};
}
function nearest(p){
  let best=null, bd=40;
  zooItems.forEach(it=>{ const d=Math.hypot(it.x-p.x, it.y-p.y); if(d<bd){bd=d;best=it;} });
  return best;
}

function zooDown(e){
  e.preventDefault();
  const p=pos(e);
  if(zooTool==='place'){
    zooItems.push({e:selectedAnimal, x:p.x, y:p.y});
    drawZoo(); saveZoo();
  } else if(zooTool==='erase'){
    const it=nearest(p);
    if(it){ zooItems=zooItems.filter(x=>x!==it); drawZoo(); saveZoo(); }
  } else if(zooTool==='move'){
    dragItem=nearest(p);
  }
}
function zooMove(e){
  if(zooTool==='move' && dragItem){
    e.preventDefault();
    const p=pos(e);
    dragItem.x=p.x; dragItem.y=p.y;
    drawZoo();
  }
}
function zooUp(){ if(dragItem){ dragItem=null; saveZoo(); } }

zoo.addEventListener('mousedown', zooDown);
zoo.addEventListener('mousemove', zooMove);
window.addEventListener('mouseup', zooUp);
zoo.addEventListener('touchstart', zooDown, {passive:false});
zoo.addEventListener('touchmove', zooMove, {passive:false});
window.addEventListener('touchend', zooUp);

function drawZoo(){
  zx.clearRect(0,0,ZW,ZH);
  // Sun
  zx.fillStyle='#fff5a8';
  zx.beginPath(); zx.arc(ZW-70, 60, 36, 0, Math.PI*2); zx.fill();
  zx.fillStyle='rgba(255,220,80,0.4)';
  zx.beginPath(); zx.arc(ZW-70, 60, 50, 0, Math.PI*2); zx.fill();
  // Clouds
  zx.fillStyle='rgba(255,255,255,0.9)';
  [[120,55,26],[300,80,22],[500,45,28]].forEach(([cx,cy,r])=>{
    zx.beginPath();
    zx.arc(cx,cy,r,0,7);
    zx.arc(cx+r*0.8,cy+4,r*0.75,0,7);
    zx.arc(cx-r*0.8,cy+4,r*0.75,0,7);
    zx.fill();
  });
  // Fence along grass top
  const grassY = ZH*0.55;
  zx.fillStyle='#8b5a2b';
  for(let x=10; x<ZW-10; x+=22){
    zx.fillRect(x, grassY-12, 4, 18);
  }
  zx.fillRect(10, grassY-6, ZW-20, 3);
  // Grass tufts
  zx.fillStyle='#2f7a1f';
  for(let i=0;i<30;i++){
    const x = (i*27 + 15) % (ZW-20) + 10;
    const y = ZH - 6 - ((i*11)%14);
    zx.beginPath();
    zx.moveTo(x,y); zx.lineTo(x-4,y-9); zx.lineTo(x,y-6); zx.lineTo(x+4,y-9); zx.closePath();
    zx.fill();
  }
  // Animals (sort by y so nearer-bottom render in front)
  zx.font='38px serif'; zx.textAlign='center'; zx.textBaseline='middle';
  [...zooItems].sort((a,b)=>a.y-b.y).forEach(it=>{
    zx.fillText(it.e, it.x, it.y);
  });
}

document.querySelectorAll('.tool').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('.tool').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    zooTool=b.dataset.tool;
  };
});
$('nameBtn').onclick=()=>{
  const v=$('nameInput').value.trim();
  if(v){ zooName = v+' 🦁'; $('zooName').textContent=zooName; saveZoo(); }
};
$('clearZoo').onclick=()=>{
  if(zooItems.length===0 || confirm('Clear all the animals from your zoo?')){
    zooItems=[]; drawZoo(); saveZoo();
  }
};

loadZoo();
$('coins').textContent=coins;
$('zooName').textContent=zooName;
renderStickers();
drawZoo();

newTarget();
</script>
</body>
</html>
