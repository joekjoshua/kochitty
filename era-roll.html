<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0C1016">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Era Roll Basketball</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Big+Shoulders+Display:wght@600;800;900&family=Chivo+Mono:wght@400;600&display=swap">
<style>
  /* Layout: a phone app. Fixed top bar, one scrolling column, a fixed bottom action bar within thumb reach,
     bottom sheets for details. Arena-at-night look: maple floor on the home screen, LED scoreboard panels.
     Single dark look by choice. */
  :root {
    --night:   #0C1016;
    --panel:   #151B24;
    --panel-2: #1D2531;
    --line:    #2A3341;
    --chalk:   #ECEFF3;
    --muted:   #95A1B2;
    --faint:   #5F6B7C;
    --maple:   #D59C60;
    --maple-2: #BF8247;
    --maple-3: #C98F55;
    --floor-ink: #22150A;
    --court-line: rgba(255, 250, 240, 0.62);
    --led:     #FFB627;   /* accent: follows difficulty (see [data-diff] below) */
    --led-soft:#A47A1D;
    --reel-bg: #12100A;
    --reel-line: #2B2410;
    --board:   #090B0F;
    --win:     #45C482;
    --loss:    #E65B50;
    --e80: #2EC4B6;
    --e90: #B583FF;
    --e00: #4EA8FF;
    --e10: #FF7A59;
    --e20: #F2689F;

    --display: "Big Shoulders Display", Impact, "Arial Narrow", sans-serif;
    --body: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "Chivo Mono", ui-monospace, Menlo, Consolas, monospace;
    --bar-h: 56px;
    color-scheme: dark;
  }

  /* Difficulty themes: Rookie sky blue, Pro arena amber, Hall of Fame violet. */
  @property --led { syntax: '<color>'; inherits: true; initial-value: #FFB627; }
  @property --led-soft { syntax: '<color>'; inherits: true; initial-value: #A47A1D; }
  :root { transition: --led .35s ease, --led-soft .35s ease; }
  :root[data-diff="rookie"] { --led: #5CC8FF; --led-soft: #3B87AE; --reel-bg: #091117; --reel-line: #173244; }
  :root[data-diff="pro"]    { --led: #FFB627; --led-soft: #A47A1D; --reel-bg: #12100A; --reel-line: #2B2410; }
  :root[data-diff="hof"]    { --led: #C38BFF; --led-soft: #8459B3; --reel-bg: #100C17; --reel-line: #2D2040; }

  * { box-sizing: border-box; }
  html, body { background: var(--night); color: var(--chalk); }
  /* Always reserve the page scrollbar so screens of different lengths never shift sideways. */
  html { overflow-y: scroll; scrollbar-gutter: stable; }
  body {
    margin: 0; font-family: var(--body); font-size: 15px; line-height: 1.45;
    -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none;
  }
  button { font: inherit; color: inherit; cursor: pointer; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  button:disabled { cursor: not-allowed; }
  :focus-visible { outline: 2px solid var(--led); outline-offset: 2px; }
  h1, h2, h3 { margin: 0; text-wrap: balance; }
  p { margin: 0; }
  .muted { color: var(--muted); font-size: 14px; }
  .fine { color: var(--faint); font-size: 12px; }

  .wrap-x { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .col { max-width: 760px; margin: 0 auto; }
  .stack { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .stack > * { min-width: 0; }
  .sec { font-family: var(--display); font-weight: 800; font-size: 17px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .sec-sub { font-family: var(--body); font-size: 12px; letter-spacing: 0; text-transform: none; font-weight: 600; color: var(--faint); }
  .card { background: var(--panel); border-radius: 16px; padding: 14px; min-width: 0; }

  /* ---------- app bar ---------- */
  .appbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    padding-top: env(safe-area-inset-top, 0px);
    background: rgba(12, 16, 22, .94); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  .appbar .bar-in {
    height: var(--bar-h); max-width: 760px; margin: 0 auto;
    display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 6px; align-items: center;
    padding-left: max(6px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  }
  .icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: transparent; border-radius: 12px; color: var(--chalk); }
  .icon-btn:active { background: var(--panel-2); }
  .ttl { min-width: 0; }
  .ttl b { display: block; font-family: var(--display); font-weight: 800; font-size: 23px; letter-spacing: .03em; text-transform: uppercase; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ttl small { display: block; font-size: 12px; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip-btn {
    border: 1.5px solid var(--led); color: var(--led); background: transparent; border-radius: 999px;
    min-height: 34px; padding: 0 12px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap;
  }
  .chip-btn:active { background: color-mix(in srgb, var(--led) 14%, transparent); }
  .stagebar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; height: 3px; max-width: 760px; margin: 0 auto; }
  .stagebar i { background: var(--line); }
  .stagebar i.on { background: var(--led); }

  .content { padding-top: calc(env(safe-area-inset-top, 0px) + var(--bar-h) + 18px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 110px); }
  .content.enter, .home.enter { animation: enter .28s cubic-bezier(.2, .8, .2, 1); }
  @keyframes enter { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }

  /* ---------- action bar ---------- */
  .actionbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    padding-top: 22px; padding-bottom: max(14px, env(safe-area-inset-bottom, 0px));
    background: linear-gradient(to top, var(--night) 62%, rgba(12, 16, 22, 0));
    pointer-events: none;
  }
  .actionbar .bar-in { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; pointer-events: auto; }
  .abtn {
    flex: 1; min-height: 54px; border: 0; border-radius: 14px; padding: 0 14px;
    font-family: var(--display); font-weight: 800; font-size: 20px; letter-spacing: .05em; text-transform: uppercase; line-height: 1;
    background: var(--panel-2); color: var(--chalk); box-shadow: inset 0 0 0 1.5px var(--line);
    transition: transform .1s ease;
  }
  .abtn.primary { flex: 1.7; background: var(--led); color: var(--night); box-shadow: 0 8px 24px color-mix(in srgb, var(--led) 22%, transparent); }
  .abtn.danger { background: var(--loss); color: var(--night); box-shadow: none; }
  .abtn.block { width: 100%; }
  .abtn:active:not(:disabled) { transform: scale(.97); }
  .abtn:disabled { opacity: .42; box-shadow: inset 0 0 0 1.5px var(--line); }
  .abtn.primary:disabled { background: var(--panel-2); color: var(--muted); }

  /* ---------- shared pieces ---------- */
  .ovr {
    width: 48px; height: 48px; flex: none; display: grid; place-items: center; border-radius: 12px;
    background: var(--board); color: var(--led); font-family: var(--display); font-weight: 900; font-size: 24px; line-height: 1;
    text-shadow: 0 0 10px color-mix(in srgb, var(--led) 40%, transparent); box-shadow: inset 0 -3px 0 var(--era, transparent);
  }
  .ovr.sm { font-size: 17px; }
  .ovr.big { width: 64px; height: 64px; font-size: 34px; border-radius: 16px; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
  .tag { font-size: 10px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; background: var(--panel-2); color: var(--led); }
  .why { display: block; font-size: 12px; color: var(--loss); font-weight: 600; margin-top: 4px; }
  .empty { text-align: center; color: var(--muted); padding: 26px 12px; border: 1.5px dashed var(--line); border-radius: 16px; font-size: 14px; }

  .list { display: grid; gap: 8px; }
  .prow, .lrow {
    display: grid; grid-template-columns: 48px minmax(0, 1fr) 14px; gap: 12px; align-items: center;
    width: 100%; text-align: left; border: 0; border-radius: 14px; padding: 10px 12px; min-height: 68px;
    background: var(--panel); color: var(--chalk);
  }
  .lrow { grid-template-columns: 48px minmax(0, 1fr); }
  button.prow:active { background: var(--panel-2); }
  .prow.off { opacity: .5; }
  .pmain { min-width: 0; }
  .pmain b { display: block; font-size: 16px; font-weight: 700; line-height: 1.2; }
  .pmeta { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
  .chev { color: var(--faint); font-size: 24px; line-height: 1; }
  .link-btn {
    flex: none; align-self: center; min-height: 36px; padding: 0 12px; border-radius: 999px;
    border: 1px solid var(--line); background: transparent; color: var(--muted);
    font-family: var(--body); font-size: 13px; font-weight: 600; letter-spacing: 0; text-transform: none;
  }
  .link-btn:active:not(:disabled) { background: var(--panel-2); }
  .link-btn:disabled { opacity: .45; }

  .need { flex: none; display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 999px; background: var(--panel); font-size: 13px; font-weight: 600; white-space: nowrap; }
  .need i { width: 8px; height: 8px; border-radius: 50%; background: var(--win); }
  .need.bad i { background: var(--loss); }
  .need.plus i { background: var(--led); }
  .need.pending { color: var(--muted); }
  .need.pending i { background: transparent; box-shadow: inset 0 0 0 1.5px var(--faint); }
  .needs { display: flex; gap: 6px; overflow-x: scroll; scrollbar-width: none; margin: 0 -16px; padding: 0 16px 2px; }
  .needs::-webkit-scrollbar { display: none; }

  .fit { margin: 0; padding: 0; list-style: none; display: grid; gap: 9px; font-size: 14px; }
  .fit li { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; }
  .fit .mk { width: 8px; height: 8px; border-radius: 50%; background: var(--win); transform: translateY(-1px); }
  .fit li.bad .mk { background: var(--loss); }
  .fit li.plus .mk { background: var(--led); }
  .fit li.pending .mk { background: transparent; box-shadow: inset 0 0 0 1.5px var(--faint); }
  .fit b { font-weight: 600; }
  .fit .d { display: block; color: var(--muted); font-size: 12px; }
  .fit em { font-style: normal; font-family: var(--mono); font-size: 13px; color: var(--win); }
  .fit li.bad em { color: var(--loss); }
  .fit li.plus em { color: var(--led); }

  .capbar { display: grid; gap: 6px; }
  .capbar .lab { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); }
  .capbar .lab b { color: var(--chalk); font-family: var(--mono); font-weight: 600; }
  .capbar .bar { height: 8px; background: var(--panel-2); border-radius: 99px; overflow: hidden; }
  .capbar .bar i { display: block; height: 100%; background: var(--e00); border-radius: 99px; }

  /* ---------- LED board ---------- */
  .board { background: var(--board); border-radius: 18px; padding: 12px; color: var(--led); box-shadow: inset 0 0 0 1px var(--reel-line); }
  .reels { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .reel { background: var(--reel-bg); border-radius: 10px; padding: 8px 10px; min-width: 0; box-shadow: inset 0 0 0 1px var(--reel-line); }
  .reel.wide { grid-column: 1 / -1; }
  .reel .k { font-family: var(--display); font-weight: 700; font-size: 11px; letter-spacing: .2em; color: var(--led-soft); }
  .reel .v { font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1.05; text-transform: uppercase; text-shadow: 0 0 12px color-mix(in srgb, var(--led) 45%, transparent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .reel.spin .v { animation: flick .08s steps(2) infinite; }
  @keyframes flick { 50% { opacity: .55; } }
  .capline { display: flex; justify-content: space-between; gap: 6px 12px; flex-wrap: wrap; margin-top: 10px; font-family: var(--mono); font-size: 12px; color: var(--led-soft); }
  .capline b { color: var(--led); font-weight: 600; }

  /* game transitions: a two-layer slab wipes across with a title card */
  .wipe { position: fixed; inset: 0; z-index: 60; overflow: hidden; }
  .wipe .slab { position: absolute; top: -20%; bottom: -20%; left: -70%; right: -70%; transform: translateX(125%) skewX(-14deg); animation: wipeIn .42s cubic-bezier(.75, 0, .25, 1) forwards; }
  .wipe .slab.dark { background: var(--board); box-shadow: inset 8px 0 0 var(--led); }
  .wipe .slab.lit {
    animation-delay: .07s; display: grid; place-items: center; color: var(--night);
    background: repeating-linear-gradient(90deg, transparent 0 46px, rgba(0, 0, 0, .07) 46px 49px), var(--led);
  }
  .wipe.loss .slab.dark { box-shadow: inset 8px 0 0 var(--loss); }
  .wipe.loss .slab.lit { background: repeating-linear-gradient(90deg, transparent 0 46px, rgba(0, 0, 0, .07) 46px 49px), var(--loss); }
  .wipe-in { transform: skewX(14deg); text-align: center; display: grid; gap: 8px; padding: 0 28px; max-width: 100vw; opacity: 0; animation: wipeText .45s cubic-bezier(.2, .8, .2, 1) .32s forwards; }
  .wipe-in .kicker { font-family: var(--display); font-weight: 800; font-size: 15px; letter-spacing: .32em; text-transform: uppercase; }
  .wipe-in b { font-family: var(--display); font-weight: 900; font-size: clamp(48px, 16vw, 148px); line-height: .85; text-transform: uppercase; white-space: nowrap; }
  .wipe-in b.long { font-size: clamp(40px, 12.5vw, 120px); }
  .wipe-in .sub { font-weight: 700; font-size: 15px; }
  .wipe-in .note { font-weight: 600; font-size: 13px; opacity: .7; }
  .wipe.out .slab { animation: wipeOut .4s cubic-bezier(.75, 0, .25, 1) forwards; }
  .wipe.out .slab.dark { animation-delay: .07s; }
  @keyframes wipeIn { from { transform: translateX(125%) skewX(-14deg); } to { transform: translateX(0) skewX(-14deg); } }
  @keyframes wipeOut { from { transform: translateX(0) skewX(-14deg); } to { transform: translateX(-135%) skewX(-14deg); } }
  @keyframes wipeText { from { opacity: 0; transform: skewX(14deg) translateX(48px) scale(.94); } to { opacity: 1; transform: skewX(14deg); } }
  .s5.pop .ring { animation: slotPop .5s cubic-bezier(.3, 1.6, .5, 1), slotBurst .7s ease-out; }
  @keyframes slotBurst {
    0% { box-shadow: 0 0 0 2px var(--era), 0 0 0 0 color-mix(in srgb, var(--led) 75%, transparent); }
    100% { box-shadow: 0 0 0 2px var(--era), 0 0 0 18px color-mix(in srgb, var(--led) 0%, transparent); }
  }
  .s5.incoming { visibility: hidden; }
  .flyer {
    position: fixed; z-index: 70; pointer-events: none; display: grid; place-items: center; transform-origin: center;
    background: var(--board); color: var(--led); font-family: var(--display); font-weight: 900; font-size: 34px; line-height: 1;
    box-shadow: 0 0 0 2px var(--era), 0 14px 34px rgba(0, 0, 0, .55), 0 0 30px color-mix(in srgb, var(--led) 35%, transparent);
    text-shadow: 0 0 12px color-mix(in srgb, var(--led) 50%, transparent);
  }
  .reel .v { transform-origin: left center; }
  .reel.lock { animation: reelFlash .7s ease-out; }
  .reel.lock .v { animation: stamp .45s cubic-bezier(.3, 1.5, .5, 1); }
  @keyframes stamp { 0% { transform: scale(1.6); opacity: 0; filter: blur(3px); } 55% { opacity: 1; filter: none; } 100% { transform: none; } }
  @keyframes reelFlash {
    0% { box-shadow: inset 0 0 0 1px var(--reel-line), 0 0 0 2px var(--led), 0 0 28px color-mix(in srgb, var(--led) 55%, transparent); }
    100% { box-shadow: inset 0 0 0 1px var(--reel-line), 0 0 0 0 transparent; }
  }
  .cascade > * { animation: rowIn .4s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i) * 45ms + 260ms); }
  @keyframes rowIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  .pickhero .big-ring.done { animation: none; font-size: 56px; }
  .vs.hit-w { animation: hitW .8s ease-out; }
  .vs.hit-l { animation: hitL .8s ease-out; }
  @keyframes hitW { 0% { box-shadow: 0 0 0 2px var(--led), 0 0 44px color-mix(in srgb, var(--led) 50%, transparent); } 100% { box-shadow: 0 0 0 0 transparent; } }
  @keyframes hitL {
    0% { box-shadow: 0 0 0 2px var(--loss), 0 0 44px color-mix(in srgb, var(--loss) 45%, transparent); transform: translateX(-6px); }
    12% { transform: translateX(6px); } 24% { transform: translateX(-4px); } 36% { transform: translateX(2px); } 48% { transform: none; }
    100% { box-shadow: 0 0 0 0 transparent; }
  }
  .vs .sc.flip { animation: flip .55s cubic-bezier(.3, 1.4, .5, 1) .1s both; }
  @keyframes flip { 0% { transform: perspective(300px) rotateX(90deg); opacity: 0; } 100% { transform: none; opacity: 1; } }
  .lastres.stamp { animation: stampIn .45s cubic-bezier(.3, 1.5, .5, 1) .25s both; }
  @keyframes stampIn { 0% { transform: scale(1.18); opacity: 0; } 100% { transform: none; opacity: 1; } }
  @keyframes slotPop { 0% { transform: scale(.2); } 100% { transform: scale(1); } }
  .board.land { animation: boardLand .55s cubic-bezier(.2, .8, .2, 1); }
  @keyframes boardLand {
    0% { transform: scale(1.035); box-shadow: inset 0 0 0 1px var(--reel-line), 0 0 0 2px var(--led), 0 0 44px color-mix(in srgb, var(--led) 45%, transparent); }
    100% { transform: none; box-shadow: inset 0 0 0 1px var(--reel-line), 0 0 0 0 transparent; }
  }

  /* watch-live switch */
  .watch-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; text-align: left; border: 0; border-radius: 14px; padding: 12px 14px; background: var(--panel); color: var(--chalk); }
  .watch-row b { display: block; font-weight: 700; font-size: 14px; }
  .watch-row small { display: block; font-size: 12px; color: var(--muted); }
  .watch-row .sw { width: 44px; height: 26px; border-radius: 99px; background: var(--line); position: relative; transition: background .2s; }
  .watch-row .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--chalk); transition: transform .2s; }
  .watch-row[aria-checked="true"] .sw { background: var(--led); }
  .watch-row[aria-checked="true"] .sw::after { transform: translateX(18px); background: var(--night); }

  /* live broadcast */
  .live { position: fixed; inset: 0; z-index: 55; overflow-y: auto; background: radial-gradient(120% 70% at 50% 0%, #1b2433 0%, var(--night) 60%); animation: fade .25s ease; }
  .live-in { max-width: 560px; margin: 0 auto; display: grid; gap: 14px;
    padding-top: calc(env(safe-area-inset-top, 0px) + 18px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .live-top { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 800; font-size: 14px; letter-spacing: .16em; color: var(--muted); }
  .live-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--loss); animation: slotPulse 1.2s infinite; box-shadow: 0 0 0 0 var(--loss); }
  .bug { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); border-radius: 12px; overflow: hidden; background: var(--board); box-shadow: 0 10px 30px rgba(0,0,0,.45); }
  .bt { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; min-width: 0; }
  .bt.you { background: linear-gradient(90deg, color-mix(in srgb, var(--led) 30%, transparent), transparent); border-left: 5px solid var(--led); }
  .bt.opp { background: linear-gradient(270deg, color-mix(in srgb, var(--opp) 30%, transparent), transparent); border-right: 5px solid var(--opp); }
  .bn { font-family: var(--display); font-weight: 800; font-size: 13px; letter-spacing: .06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .bs { flex: none; font-family: var(--display); font-weight: 900; font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; color: var(--chalk); }
  .bc { display: grid; place-items: center; padding: 6px 10px; background: #000; min-width: 70px; }
  .bc span { font-family: var(--display); font-weight: 800; font-size: 13px; letter-spacing: .12em; color: var(--led); }
  .bc b { font-family: var(--mono); font-size: 18px; color: var(--chalk); font-variant-numeric: tabular-nums; }
  .leadbar { position: relative; height: 6px; background: var(--panel-2); border-radius: 99px; overflow: hidden; }
  .leadbar::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: var(--faint); }
  .leadbar i { position: absolute; top: 0; bottom: 0; transition: width .3s, left .3s; }
  .leadbar i.y { background: var(--led); } .leadbar i.o { background: var(--opp); }
  .lv-call { text-align: center; font-family: var(--display); font-weight: 900; font-size: clamp(24px, 7vw, 34px); text-transform: uppercase; line-height: 1.05; min-height: 2.1em; display: grid; place-items: center; }
  .lv-call.y { color: var(--led); } .lv-call.o { color: var(--opp); }
  .lv-call.pop { animation: stampIn .35s cubic-bezier(.3, 1.5, .5, 1); }
  .lv-call.final { font-size: clamp(28px, 9vw, 44px); }
  .lv-line { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 13px; background: var(--panel); border-radius: 12px; overflow: hidden; }
  .lv-line th, .lv-line td { padding: 7px 8px; text-align: center; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .lv-line th { font-family: var(--body); font-size: 10px; letter-spacing: .12em; color: var(--faint); }
  .lv-line td:first-child { text-align: left; font-family: var(--display); font-weight: 800; letter-spacing: .06em; }
  .lv-line td:last-child { color: var(--chalk); font-weight: 600; }
  .lv-leaders { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--muted); }
  .lv-leaders span:first-child { color: var(--led); }
  .lv-feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; min-height: 230px; align-content: start; }
  .lv-feed li { display: grid; grid-template-columns: 74px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; background: var(--panel); border-radius: 10px; padding: 8px 10px; font-size: 13px; border-left: 3px solid var(--line); animation: rowIn .3s ease both; }
  .lv-feed li.y { border-left-color: var(--led); } .lv-feed li.o { border-left-color: var(--opp); }
  .lv-feed li span { font-family: var(--mono); font-size: 11px; color: var(--faint); }
  .lv-feed li b { font-family: var(--mono); font-weight: 600; }
  .lv-ctrl { display: flex; gap: 10px; align-items: center; }
  .lv-speed { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--panel); border-radius: 12px; padding: 4px; }
  .lv-speed button { border: 0; background: transparent; min-width: 48px; min-height: 44px; border-radius: 9px; font-family: var(--display); font-weight: 800; font-size: 17px; color: var(--muted); }
  .lv-speed button[aria-pressed="true"] { background: var(--panel-2); color: var(--chalk); box-shadow: inset 0 -2px 0 var(--led); }

  /* team badges */
  .tb { flex: none; display: inline-grid; place-items: center; width: var(--s); height: var(--s); border-radius: 50%; vertical-align: middle;
    background: color-mix(in srgb, var(--tc) 20%, var(--board)); color: var(--tc); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--tc) 55%, transparent); }
  .tb svg { width: 62%; height: 62%; }
  .named { display: inline-flex; align-items: center; gap: 8px; min-width: 0; max-width: 100%; }
  .named > :last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .reel-team { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .reel-team .v { min-width: 0; }
  .vs .tn { display: flex; align-items: center; gap: 8px; }
  .vs .side.r .tn { justify-content: flex-end; }
  .match .tm { grid-template-columns: 20px 18px minmax(0, 1fr) auto; }
  .seed-r { grid-template-columns: 26px 22px minmax(0, 1fr) 40px 44px; }
  .bn-wrap { display: flex; align-items: center; gap: 7px; min-width: 0; }
  @media (max-width: 440px) { .bt.opp .bn { display: none; } }

  /* pre-roll pick card and budget */
  .pickhero {
    display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: center;
    background: var(--board); border-radius: 18px; padding: 18px; box-shadow: inset 0 0 0 1px var(--reel-line);
  }
  .pickhero .big-ring {
    width: 108px; height: 108px; border-radius: 50%; display: grid; place-items: center;
    border: 3px solid var(--led); background: color-mix(in srgb, var(--led) 12%, transparent);
    font-family: var(--display); font-weight: 900; font-size: 70px; line-height: 1; color: var(--led);
    text-shadow: 0 0 18px color-mix(in srgb, var(--led) 55%, transparent);
    animation: slotPulse 1.6s ease-in-out infinite;
  }
  .pickhero .k { display: block; font-family: var(--display); font-weight: 700; font-size: 12px; letter-spacing: .2em; color: var(--led-soft); }
  .pickhero b { display: block; font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1; text-transform: uppercase; margin: 6px 0 6px; }
  .pickhero .d { display: block; font-size: 13px; color: var(--muted); }
  .budget { display: grid; gap: 10px; }
  .btiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btiles > div { background: var(--panel-2); border-radius: 12px; padding: 10px 12px; display: grid; gap: 1px; }
  .btiles .k { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
  .btiles b { font-family: var(--mono); font-weight: 600; font-size: 30px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .btiles b.hi { color: var(--led); }
  .btiles .d { font-size: 12px; color: var(--muted); }
  .budget .bar { height: 6px; background: var(--panel-2); border-radius: 99px; overflow: hidden; }
  .budget .bar i { display: block; height: 100%; background: var(--led); border-radius: 99px; }
  .budget-line { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .budget-line .need { font-weight: 500; color: var(--muted); }
  .budget-line .need b { font-family: var(--mono); font-weight: 600; color: var(--chalk); }
  .budget-line .need:first-child b { color: var(--led); }

  /* draft dock: lineup + needs stay pinned under the app bar and compact once the page scrolls */
  .dock {
    position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--bar-h) + 3px); z-index: 8;
    display: grid; gap: 10px; margin: -10px -16px 0; padding: 10px 16px; background: var(--night);
    transition: box-shadow .2s ease;
  }
  .dock.compact { box-shadow: 0 12px 18px -10px rgba(0, 0, 0, .7); }
  .dock .strip5 { transition: padding .2s ease; }
  .dock.compact .strip5 { padding: 8px 10px; gap: 0; }
  .dock.compact .strip5-head { display: none; }
  .dock.compact .s5 .ring { width: 38px; height: 38px; font-size: 17px; }
  .dock.compact .s5 small { display: none; }
  .s5 .ring { transition: width .2s ease, height .2s ease, font-size .2s ease; }

  /* lineup strip */
  .strip5 { display: grid; gap: 10px; width: 100%; border: 0; text-align: left; color: var(--chalk); }

  .strip5-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-family: var(--display); font-weight: 800; font-size: 17px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .strip5-head b { color: var(--led); font-family: var(--mono); font-weight: 600; font-size: 14px; letter-spacing: 0; }
  .strip5-head .more { font-family: var(--body); font-size: 12px; letter-spacing: 0; text-transform: none; color: var(--faint); font-weight: 600; margin-left: 8px; }
  .s5row { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
  .s5 { display: grid; justify-items: center; gap: 5px; min-width: 0; }
  .s5 .ring { width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; background: var(--board); color: var(--led); font-family: var(--display); font-weight: 900; font-size: 22px; box-shadow: 0 0 0 2px var(--era, var(--line)); }
  .s5.open .ring { background: transparent; color: var(--faint); box-shadow: none; border: 1.5px dashed var(--faint); font-size: 18px; }
  .s5.open:not(.current):not(.ready):not(.target) { opacity: .45; }
  button.s5 { border: 0; background: transparent; padding: 0; color: inherit; font: inherit; cursor: pointer; }
  button.s5:active .ring { transform: scale(.94); }
  .s5.moving .ring { transform: translateY(-4px) scale(1.08); box-shadow: 0 0 0 3px var(--led), 0 10px 22px rgba(0, 0, 0, .5); }
  .s5.target .ring { border: 2px dashed var(--led); box-shadow: 0 0 0 2px var(--era, transparent); animation: slotPulse 1.4s ease-in-out infinite; }
  .s5.open.target .ring { color: var(--led); }
  .s5.blocked { opacity: .3; }
  .s5 small em { font-style: normal; color: var(--led); font-weight: 700; }
  .strip5-hint { font-size: 12px; color: var(--faint); text-align: center; }
  .strip5.is-moving .strip5-hint { color: var(--led); }
  .more-btn { border: 0; background: transparent; color: inherit; padding: 4px 0 4px 8px; font: inherit; display: inline-flex; align-items: baseline; gap: 0; cursor: pointer; }
  .dock.compact .strip5-hint { display: none; }
  .s5.open.ready .ring { border-color: color-mix(in srgb, var(--led) 60%, transparent); color: var(--led); }
  .s5 .ring.pos { font-size: 17px; letter-spacing: .02em; }
  .poschoice { display: grid; gap: 8px; }
  .pos-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .pos-chip { min-width: 72px; min-height: 52px; border: 1.5px solid var(--line); background: var(--panel-2); border-radius: 12px; padding: 6px 12px; font-family: var(--display); font-weight: 900; font-size: 22px; color: var(--chalk); display: grid; justify-items: center; line-height: 1; gap: 2px; }
  .pos-chip small { font-family: var(--body); font-size: 10px; font-weight: 600; color: var(--muted); text-transform: none; }
  .pos-chip[aria-pressed="true"] { border-color: var(--led); background: color-mix(in srgb, var(--led) 14%, var(--panel-2)); color: var(--led); }
  .s5 small i { display: block; font-style: normal; font-size: 10px; font-weight: 700; letter-spacing: .1em; color: var(--faint); text-align: center; }
  .pickhero .big-ring.pos { font-size: 52px; }
  .s5.current .ring {
    border: 2px solid var(--led); color: var(--led); font-size: 22px;
    background: color-mix(in srgb, var(--led) 14%, transparent);
    animation: slotPulse 1.6s ease-in-out infinite;
  }
  .s5.current small { color: var(--led); font-weight: 700; }
  @keyframes slotPulse {
    0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--led) 45%, transparent); }
    50% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--led) 0%, transparent); }
  }
  .s5 small { font-size: 11px; font-weight: 600; color: var(--muted); max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- sheets ---------- */
  .sheet-layer { position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
  .backdrop { position: absolute; inset: 0; background: rgba(0, 0, 0, .58); animation: fade .2s ease; }
  .sheet {
    position: relative; width: 100%; max-width: 760px; max-height: 88%; overflow-y: scroll; overscroll-behavior: contain;
    background: var(--panel); border-radius: 22px 22px 0 0;
    padding-top: 6px; padding-bottom: calc(max(16px, env(safe-area-inset-bottom, 0px)) + 4px);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid; gap: 14px; animation: up .28s cubic-bezier(.2, .8, .2, 1);
  }
  .grab { width: 40px; height: 5px; border-radius: 99px; background: var(--line); margin: 4px auto 0; }
  .sh-title { font-family: var(--display); font-weight: 900; font-size: 28px; text-transform: uppercase; line-height: 1; }
  .sh-head { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: center; }
  .sh-head h2 { font-family: var(--display); font-weight: 900; font-size: 30px; text-transform: uppercase; line-height: .95; }
  .sgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .sgrid div { background: var(--panel-2); border-radius: 12px; padding: 10px 6px; text-align: center; }
  .sgrid b { display: block; font-family: var(--mono); font-weight: 600; font-size: 22px; font-variant-numeric: tabular-nums; }
  .sgrid span { display: block; font-size: 10px; font-weight: 700; letter-spacing: .12em; color: var(--faint); }
  .fills { display: flex; flex-wrap: wrap; gap: 6px; }
  .fills .need { background: var(--panel-2); white-space: normal; }
  .row2 { display: flex; gap: 10px; }
  .opt { text-align: left; width: 100%; border: 0; border-radius: 14px; padding: 12px 14px; background: var(--panel-2); display: grid; gap: 3px; color: var(--chalk); }
  .opt.on { box-shadow: inset 0 0 0 2px var(--led); }
  .opt:active:not(:disabled) { transform: scale(.99); }
  .opt:disabled { opacity: .55; }
  .opt b { font-family: var(--display); font-weight: 800; font-size: 21px; letter-spacing: .04em; text-transform: uppercase; }
  .opt span { font-size: 13px; color: var(--muted); }
  @keyframes up { from { transform: translateY(100%); } to { transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  .toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 96px); z-index: 30;
    transform: translateX(-50%); max-width: calc(100% - 32px);
    background: var(--chalk); color: var(--night); font-weight: 700; font-size: 14px;
    padding: 10px 18px; border-radius: 999px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .4); animation: toast 1.9s ease forwards; pointer-events: none;
  }
  @keyframes toast { 0% { opacity: 0; transform: translate(-50%, 10px); } 12%, 82% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, 0); } }

  /* ---------- home ---------- */
  .home { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 110px); }
  .floor {
    position: relative; overflow: hidden; color: var(--floor-ink);
    background:
      linear-gradient(180deg, rgba(255, 240, 215, .16), rgba(0, 0, 0, .10)),
      repeating-linear-gradient(90deg, transparent 0 57px, rgba(70, 35, 8, .20) 57px 58px),
      repeating-linear-gradient(90deg, var(--maple) 0 174px, var(--maple-2) 174px 290px, var(--maple-3) 290px 406px, var(--maple) 406px 580px);
    border-bottom: 5px solid var(--floor-ink);
  }
  .floor svg.court { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .floor-in { position: relative; padding-block: 18px 26px; display: grid; gap: 16px; }
  .site-link { font-family: var(--display); font-weight: 800; font-size: 14px; letter-spacing: .14em; text-transform: uppercase; color: var(--floor-ink); text-decoration: none; opacity: .75; justify-self: start; padding: 6px 0; }
  .logo { font-family: var(--display); font-weight: 900; font-size: clamp(72px, 22vw, 150px); line-height: .82; text-transform: uppercase; }
  .logo span { display: block; }
  .logo .sub { font-size: .24em; letter-spacing: .32em; font-weight: 800; margin-top: .4em; }
  .tagline { font-size: 17px; font-weight: 500; max-width: 34ch; line-height: 1.4; }
  .floor .board { box-shadow: 0 0 0 4px var(--floor-ink), 0 18px 40px rgba(0, 0, 0, .35); }
  .home-body { padding-top: 20px; }
  .seg3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; background: var(--board); border-radius: 12px; padding: 4px; }
  .seg3 button { border: 0; background: transparent; min-height: 44px; padding: 0 4px; border-radius: 9px; font-family: var(--display); font-weight: 800; font-size: 16px; letter-spacing: .03em; text-transform: uppercase; white-space: nowrap; color: var(--muted); }
  .seg3 button[aria-pressed="true"] { background: var(--led); color: var(--night); }
  .rules { font-size: 13px; color: var(--muted); margin-top: 10px; }
  .carousel { display: grid; grid-auto-flow: column; grid-auto-columns: 78%; gap: 10px; overflow-x: scroll; scroll-snap-type: x mandatory; scrollbar-width: none; margin: 0 -16px; padding: 0 16px 2px; }
  .carousel::-webkit-scrollbar { display: none; }
  .step { scroll-snap-align: start; background: var(--panel); border-radius: 16px; padding: 14px; border-top: 3px solid var(--led); }
  .step .n { font-family: var(--display); font-weight: 900; font-size: 30px; color: var(--led); line-height: 1; }
  .step h3 { font-family: var(--display); font-weight: 800; font-size: 22px; text-transform: uppercase; margin: 4px 0; }
  .step p { color: var(--muted); font-size: 14px; }
  .erachips { display: flex; gap: 6px; overflow-x: scroll; scrollbar-width: none; margin: 0 -16px 10px; padding: 0 16px; }
  .erachips::-webkit-scrollbar { display: none; }
  .erachips button { flex: none; min-height: 38px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line); background: transparent; font-family: var(--display); font-weight: 800; font-size: 17px; color: var(--muted); }
  .erachips button[aria-pressed="true"] { border-color: var(--era); color: var(--night); background: var(--era); }
  .best { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .best b { font-family: var(--display); font-weight: 800; font-size: 24px; text-transform: uppercase; color: var(--led); display: block; line-height: 1.05; }

  /* ---------- season ---------- */
  .scoreboard { background: var(--board); border-radius: 18px; padding: 14px 16px; color: var(--led); display: grid; grid-template-columns: 1fr 1fr 1.1fr; gap: 10px; align-items: end; box-shadow: inset 0 0 0 1px var(--reel-line); }
  .scoreboard .k { font-family: var(--display); font-weight: 700; font-size: 11px; letter-spacing: .2em; color: var(--led-soft); }
  .scoreboard .v { font-family: var(--display); font-weight: 900; font-size: clamp(48px, 15vw, 72px); line-height: .9; text-shadow: 0 0 16px color-mix(in srgb, var(--led) 45%, transparent); font-variant-numeric: tabular-nums; }
  .scoreboard .v.sm { font-size: clamp(22px, 6vw, 30px); line-height: 1.05; }
  .strip { display: grid; grid-template-columns: repeat(21, minmax(0, 1fr)); gap: 3px; }
  .strip i { aspect-ratio: 1; border-radius: 2px; background: var(--panel-2); max-width: 100%; }
  .strip i.w { background: var(--win); }
  .strip i.l { background: var(--loss); }
  .lastgame { font-family: var(--mono); font-size: 13px; color: var(--muted); min-height: 1.5em; }
  .lastgame .W { color: var(--win); font-weight: 600; }
  .lastgame .L { color: var(--loss); font-weight: 600; }
  .hero-num { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: var(--board); color: var(--led); }
  .hero-num .k { display: block; font-family: var(--display); font-weight: 700; font-size: 11px; letter-spacing: .2em; color: var(--led-soft); }
  .hero-num .big { display: block; font-family: var(--display); font-weight: 900; font-size: 54px; line-height: .95; text-shadow: 0 0 16px color-mix(in srgb, var(--led) 45%, transparent); }
  .facts { display: grid; gap: 10px; }
  .fact { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; border-bottom: 1px solid var(--line); padding-bottom: 9px; }
  .fact:last-child { border-bottom: 0; padding-bottom: 0; }
  .fact span { color: var(--muted); }
  .fact b { text-align: right; font-weight: 600; }

  .avg { display: grid; }
  .avg-r { display: grid; grid-template-columns: minmax(0, 1fr) repeat(4, 42px); gap: 6px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 14px; text-align: right; font-variant-numeric: tabular-nums; }
  .avg-r:last-child { border-bottom: 0; }
  .avg-r > span:first-child { text-align: left; font-family: var(--body); min-width: 0; }
  .avg-r b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .avg-r small { display: block; font-size: 11px; color: var(--muted); }
  .avg-r.head { font-family: var(--body); font-size: 10px; font-weight: 700; letter-spacing: .12em; color: var(--faint); padding-top: 0; }
  .seeds { display: grid; }
  .seed-r { display: grid; grid-template-columns: 26px minmax(0, 1fr) 40px 44px; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .seed-r:last-child { border-bottom: 0; }
  .seed-r > span:not(.nm) { font-family: var(--mono); text-align: right; color: var(--muted); }
  .seed-r .sd { text-align: left !important; color: var(--faint) !important; }
  .seed-r .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seed-r.you .nm { color: var(--led); font-weight: 700; }
  .seed-r.cut { opacity: .5; }
  .zone { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; padding: 12px 0 4px; color: var(--win); }
  .zone.z-playin { color: var(--led); }
  .zone.z-out { color: var(--loss); }

  /* ---------- playoffs ---------- */
  .vs { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 10px; align-items: center; background: var(--board); border-radius: 18px; padding: 14px; }
  .vs .side { min-width: 0; }
  .vs .side.r { text-align: right; }
  .vs .tn { font-family: var(--display); font-weight: 800; font-size: 19px; text-transform: uppercase; line-height: 1.05; }
  .vs .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .vs .sc { font-family: var(--display); font-weight: 900; font-size: 54px; color: var(--led); line-height: .9; text-shadow: 0 0 16px color-mix(in srgb, var(--led) 45%, transparent); font-variant-numeric: tabular-nums; }
  .tabs {
    position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--bar-h) + 6px); z-index: 10;
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 12px;
    background: var(--panel); box-shadow: 0 6px 18px rgba(0, 0, 0, .35);
  }
  .tabs.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stakes p { font-size: 15px; line-height: 1.5; }
  .tabs button { border: 0; background: transparent; min-height: 40px; border-radius: 9px; font-family: var(--display); font-weight: 800; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .tabs button[aria-selected="true"] { background: var(--panel-2); color: var(--chalk); box-shadow: inset 0 -2px 0 var(--led); }
  .plans { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .plan { text-align: left; display: grid; gap: 4px; align-content: start; background: var(--panel); border: 2px solid transparent; border-radius: 14px; padding: 12px; min-height: 118px; color: var(--chalk); }
  .plan:active { transform: scale(.98); }
  .plan[aria-pressed="true"] { border-color: var(--led); background: var(--panel-2); }
  .plan b { font-family: var(--display); font-weight: 800; font-size: 19px; letter-spacing: .03em; text-transform: uppercase; line-height: 1.05; }
  .plan span { font-size: 12px; color: var(--muted); }
  .plan .dots { letter-spacing: 2px; color: var(--led); font-size: 11px; }
  .plan .warn { color: var(--loss); font-weight: 600; }
  .plan .pc { font-family: var(--mono); font-size: 12px; font-weight: 600; }
  .plan .pc.up { color: var(--win); }
  .plan .pc.down { color: var(--loss); }
  .odds { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: baseline; background: var(--panel); border-radius: 14px; padding: 10px 14px; }
  .odds span:first-child { font-size: 13px; color: var(--muted); }
  .odds b { font-family: var(--mono); font-size: 24px; color: var(--chalk); grid-row: span 2; align-self: center; }
  .odds .muted { font-size: 12px; }
  .scout-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .trait { background: var(--panel); border-radius: 14px; padding: 12px; display: grid; gap: 5px; }
  .trait .k { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
  .trait .v { font-family: var(--display); font-weight: 800; font-size: 22px; text-transform: uppercase; line-height: 1; }
  .trait .v.weak { color: var(--win); }
  .trait .v.strong { color: var(--loss); }
  .trait .bar { height: 6px; background: var(--panel-2); border-radius: 99px; overflow: hidden; }
  .trait .bar i { display: block; height: 100%; background: var(--muted); }
  .trait.target { box-shadow: inset 0 0 0 2px var(--win); }
  .lastres { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center; background: var(--panel); border-radius: 14px; padding: 10px 12px; }
  .lastres .res { font-family: var(--display); font-weight: 900; font-size: 30px; line-height: 1; }
  .res.W { color: var(--win); }
  .res.L { color: var(--loss); }
  .lastres .d { font-size: 13px; color: var(--muted); }
  .lastres .d b { color: var(--chalk); font-family: var(--mono); }
  .game { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: center; background: var(--panel); border-radius: 14px; padding: 10px 12px; }
  .game .res { font-family: var(--display); font-weight: 900; font-size: 24px; }
  .game .t { font-size: 14px; font-weight: 600; }
  .game .line { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .bracket-wrap { overflow-x: scroll; margin: 0 -16px; padding: 0 16px 6px; }
  .bracket { display: grid; grid-template-columns: repeat(3, 160px); gap: 12px; }
  .bcol { display: flex; flex-direction: column; justify-content: space-around; gap: 8px; }
  .bcol h3 { font-family: var(--display); font-weight: 800; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .match { background: var(--panel); border-radius: 8px; overflow: hidden; font-size: 13px; }
  .match .tm { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 6px; padding: 6px 8px; align-items: center; }
  .match .tm + .tm { border-top: 1px solid var(--line); }
  .match .sd { font-family: var(--mono); font-size: 11px; color: var(--faint); }
  .match .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .match .w { font-family: var(--mono); color: var(--muted); }
  .match .tm.win .nm { font-weight: 700; }
  .match .tm.win .w { color: var(--led); }
  .match .tm.lose { opacity: .5; }
  .match .tm.you .nm { color: var(--led); }
  .match.tbd { opacity: .45; }

  .banner {
    border-radius: 18px; padding: 26px 18px; text-align: center; color: var(--floor-ink);
    background:
      repeating-linear-gradient(90deg, transparent 0 57px, rgba(70, 35, 8, .2) 57px 58px),
      repeating-linear-gradient(90deg, var(--maple) 0 174px, var(--maple-2) 174px 290px, var(--maple-3) 290px 406px, var(--maple) 406px 580px);

  .banner .big { font-family: var(--display); font-weight: 900; font-size: clamp(46px, 14vw, 96px); line-height: .85; text-transform: uppercase; }
  .banner p { font-weight: 600; margin-top: 10px; }
  .banner.out { background: var(--panel); color: var(--chalk); }
  .banner.out .big { color: var(--loss); font-size: clamp(34px, 10vw, 64px); }

  @media (min-width: 761px) {
    .sheet-layer { align-items: center; }
    .sheet { max-width: 540px; border-radius: 22px; max-height: 84%; }
    .carousel { grid-auto-columns: calc(50% - 5px); }
    .strip { grid-template-columns: repeat(41, minmax(0, 1fr)); }
    .bracket { grid-template-columns: repeat(3, minmax(160px, 1fr)); }
  }
  @media (prefers-reduced-motion: reduce) {

    .wipe.out { animation: wipeFadeOut .3s ease both !important; }

  const names = f => starters.filter(f).map(p => p.name.split(' ').slice(-1)[0]).join(', ');

  const sc = starters.filter(isScorer).length;
  add('Go-to scoring', sc === 0 ? 'No 24+ PPG scorer' : sc <= 2 ? `${sc} scorer${sc > 1 ? 's' : ''}: ${names(isScorer)}` : `${sc} scorers share one ball`,
      sc === 0 ? -1.5 : sc <= 2 ? 0 : -2 * (sc - 2), sc >= 1 && sc <= 2);
  const pm = starters.filter(isPlaymaker).length;
  add('Playmaking', pm ? names(isPlaymaker) : 'Nobody averages 6+ assists', pm ? 0 : -1.5, pm > 0);
  const sh = starters.filter(isShooter).length;
  add('Spacing', `${sh} shooter${sh === 1 ? '' : 's'}${sh ? ': ' + names(isShooter) : ''}`, sh === 0 ? -2 : sh === 1 ? -1 : sh === 2 ? 0 : 1, sh >= 2);
  const rp = starters.filter(isRim).length;
  add('Rim protection', rp ? names(isRim) : 'Nobody averages 1.5+ blocks', rp ? 0 : -1.5, rp > 0);
  const reb = starters.reduce((s2, p) => s2 + p.reb, 0);
  add('Rebounding', `${f1(reb)} per game from the starters (28 needed)`, reb < 28 ? -1.5 : reb >= 36 ? 0.5 : 0, reb >= 28);
  const st = starters.filter(isStopper).length;
  if (st) add('Perimeter defense', names(isStopper), 0.5, true);
  const guards = starters.filter(p => p.pos === 'PG' || p.pos === 'SG').length;
  const bigs = starters.filter(p => p.pos === 'PF' || p.pos === 'C').length;
  if (guards >= 4) add('Size', `${guards} guards`, -1, false);
  if (bigs >= 4) add('Spacing inside', `${bigs} bigs crowd the paint`, -1, false);
  if (full && new Set(starters.map(p => p.era)).size === 1) add('Era chemistry', 'All five from one era', 1, true);
  if (full && rows.slice(0, 5).every(r => r.delta >= 0)) add('Complete team', 'Scoring, playmaking, spacing, rim protection and rebounding covered', 1, true);
  const bonus = rows.reduce((s2, r) => s2 + r.delta, 0);
  return { bonus, rows };
}

/* ---------- playoff game plans ---------- */
const PLANS = [
  { k: 'paint',  trait: 'rim',   name: 'Pound the paint',      attacks: 'weak rim protection',   needs: 'a scoring big' },
  { k: 'boards', trait: 'reb',   name: 'Crash the boards',     attacks: 'poor rebounding',       needs: 'rebounders' },
  { k: 'star',   trait: 'star',  name: 'Lock down their star', attacks: 'a one-man offense',     needs: 'a perimeter stopper' },
  { k: 'space',  trait: 'perim', name: 'Pace and space',       attacks: 'weak perimeter defense', needs: 'shooters' },
];
const TRAITS = [
  { k: 'rim',   label: 'Rim protection',    invert: true },
  { k: 'reb',   label: 'Rebounding',        invert: true },
  { k: 'star',  label: 'Star reliance',     invert: false },
  { k: 'perim', label: 'Perimeter defense', invert: true },
];
function teamTraits(team) {
  const st = team.starters.filter(p => !p.generic);
  const pts = st.map(p => p.pts);
  return {
    rim: Math.max(...st.map(p => p.blk)),
    reb: st.reduce((a, p) => a + p.reb, 0),
    star: Math.max(...pts) / pts.reduce((a, x) => a + x, 0),
    perim: st.reduce((a, p) => a + p.stl, 0),
  };
}
function traitNorm(teams) {
  const n = {};
  TRAITS.forEach(t => {
    const xs = teams.map(tm => teamTraits(tm)[t.k]);
    n[t.k] = { min: Math.min(...xs), max: Math.max(...xs) };
  });
  return n;
}
function vulnerability(team, norm) {
  const tr = teamTraits(team), v = {};
  TRAITS.forEach(t => {
    const { min, max } = norm[t.k];
    const x = max > min ? (tr[t.k] - min) / (max - min) : 0.5;
    v[t.k] = clamp(t.invert ? 1 - x : x, 0, 1);
  });
  return v;
}
function execution(team) {
  const st = team.starters;
  const bigPts = Math.max(0, ...st.filter(p => p.pos === 'PF' || p.pos === 'C').map(p => p.pts));
  return {
    paint: clamp((bigPts - 8) / 17, 0, 1),
    boards: clamp((st.reduce((a, p) => a + p.reb, 0) - 24) / 16, 0, 1),
    star: clamp((Math.max(...st.map(p => p.stl + 0.5 * p.blk)) - 0.8) / 1.7, 0, 1),
    space: clamp(st.filter(isShooter).length / 4, 0, 1),
  };
}
const RANK_EFFECT = [5, 1.5, -2, -4.5]; // their weakest trait first, their strongest last
function planEffect(plan, vuln, exec, repeats) {
  const order = TRAITS.map(t => t.k).sort((a, b) => vuln[b] - vuln[a]);
  const base = RANK_EFFECT[order.indexOf(plan.trait)];
  return (base > 0 ? base * (0.6 + 0.4 * exec[plan.k]) : base) - repeats;
}
// Win chance for the user in the next game of a series, with a rating adjustment from the game plan.
function nextGameChance(s, adj) {
  const youA = s.a.team.user, you = youA ? s.a : s.b, opp = youA ? s.b : s.a;
  const aHome = HOME_PATTERN[s.games.length] === 0;
  const youHome = youA ? aHome : !aHome;
  return winProb({ rating: you.team.rating + adj }, opp.team, youHome ? HOME_EDGE : -HOME_EDGE);
}
function repeatsFor(series, planKey) {
  let k = 0;
  for (let i = series.games.length - 1; i >= 0 && series.games[i].plan === planKey; i--) k++;
  return k;
}

function rateLineup(starters, bench) {
  const chem = chemistry(starters);
  const r = 0.8 * avg(starters.map(p => p.ovr)) + 0.2 * avg(bench.map(p => p.ovr)) + chem.bonus;
  return { rating: r, chem };
}

// Best starting five with one player per position (players may fill any position they can play),
// scored by average rating plus the team-fit bonus.
function bestLineup(pool) {
  const cands = POS_ORDER.map(pos => pool.filter(p => posOf(p).includes(pos)).sort((a, b) => b.ovr - a.ovr).slice(0, 6));
  let best = null, bestScore = -Infinity;
  const pick = [], used = new Set();
  const walk = k => {
    if (k === 5) {
      const score = avg(pick.map(p => p.ovr)) + chemistry(pick).bonus;
      if (score > bestScore) { bestScore = score; best = pick.slice(); }
      return;
    }
    for (const p of cands[k]) {
      if (used.has(p.name)) continue;
      used.add(p.name); pick.push({ ...p, pos: POS_ORDER[k] });
      walk(k + 1);
      pick.pop(); used.delete(p.name);
    }
  };
  walk(0);
  return best || pool.slice(0, 5);
}
const leagueCache = new Map();
function buildRealTeam(t, takenNames) {
  const pool = t.players.filter(p => !takenNames.has(p.name)).slice().sort((a, b) => b.ovr - a.ovr);
  const starters = bestLineup(pool);
  const names = new Set(starters.map(p => p.name));
  const bench = pool.filter(p => !names.has(p.name)).slice(0, 3);
  let k = 0;
  while (bench.length < 3) bench.push(filler(k++));
  const { rating, chem } = rateLineup(starters, bench);
  return {
    key: 't' + t.id, src: t, label: teamLabel(t), short: teamShort(t), era: t.era,
    starters, bench, rating, chem, pace: ERA_INFO[t.era].pace,
  };
}

function buildUserTeam(picks, benchOvr) {
  const starters = picks.map(r => { const pl = TEAMS[r.t].players[r.i]; return { ...pl, pos: r.pos || pl.pos }; })
    .sort((a, b) => POS_ORDER.indexOf(a.pos) - POS_ORDER.indexOf(b.pos));
  const bench = [0, 1, 2].map(i => ({ ...filler(i), ovr: benchOvr, pts: 6, reb: 3, ast: 1.5 }));
  const { rating, chem } = rateLineup(starters, bench);
  return {
    key: 'you', user: true, label: 'Your Five', short: 'Your Five', era: 'mixed',
    starters, bench, rating, chem, pace: avg(starters.map(p => ERA_INFO[p.era].pace)),
  };
}

function winProb(a, b, edge) { return Phi(MARGIN_K * (a.rating - b.rating + edge) / MARGIN_SD); }

function expectedWins(team, league) {
  const others = league.filter(o => o.key !== team.key);
  return 82 * avg(others.map(o => winProb(team, o, 0)));
}

function boxScore(team, pts) {
  const roster = team.starters.concat(team.bench);
  const w = roster.map(p => Math.max(0.3, Math.pow(p.pts, 1.15) * (1 + 0.24 * normal())));
  const sw = w.reduce((s, x) => s + x, 0);
  const share = w.map(x => Math.max(0, Math.round(pts * x / sw)));
  // put the rounding remainder on the top scorer so the players add up to the team score exactly
  const top = share.indexOf(Math.max(...share));
  share[top] = Math.max(0, share[top] + pts - share.reduce((a, x) => a + x, 0));
  return roster.map((p, i) => {
    const pp = share[i];
    const fgm = Math.round(pp / 2.35);
    const pct = clamp((p.fg / 100) * (1 + 0.12 * normal()), 0.2, 0.85);
    const fga = Math.max(fgm, Math.round(fgm / pct));
    const cnt = x => Math.max(0, Math.round(x + normal() * Math.sqrt(Math.max(x, 0.2))));
    return {
      p, pts: pp, fgm, fga,
      reb: Math.max(0, Math.round(p.reb * (1 + 0.28 * normal()))),
      ast: Math.max(0, Math.round(p.ast * (1 + 0.3 * normal()))),
      stl: cnt(p.stl), blk: cnt(p.blk),
    };
  });
}

/* ---------- play-by-play: rebuild a game's scoring from its final box score ---------- */
// Returns scoring events with a game-clock time in minutes (0-48, OT 48-53) whose totals match the final score.
function buildPlayByPlay(boxA, boxB, ptsA, ptsB, ot) {
  const budgets = [boxA, boxB].map(box => box.map(l => ({ p: l.p, left: l.pts })));
  const events = [];
  const take = (side, value, t, kind) => {
    // pick a player on this side who still has the points, weighted by what he has left
    const pool = budgets[side].filter(b => b.left >= value);
    if (!pool.length) return false;
    let r = rand() * pool.reduce((a, b) => a + b.left, 0), who = pool[0];
    for (const b of pool) { r -= b.left; if (r <= 0) { who = b; break; } }
    who.left -= value;
    events.push({ side, p: who.p, value, kind, t });
    return true;
  };
  if (ot) {
    // regulation must end tied: overtime points differ by exactly the final margin
    const loserOT = 4 + Math.floor(rand() * 7);
    const otA = ptsA > ptsB ? loserOT + (ptsA - ptsB) : loserOT, otB = ptsB > ptsA ? loserOT + (ptsB - ptsA) : loserOT;
    [otA, otB].forEach((target, side) => {
      let rem = target;
      while (rem > 0) {
        const v = rem >= 3 && rand() < 0.3 ? 3 : rem >= 2 ? 2 : 1;
        const t = 48 + rand() * 5;
        if (!take(side, v, t, v === 1 ? 'ft1' : String(v)) && !take(side, 1, t, 'ft1')) break;
        rem -= events[events.length - 1].value;
      }
    });
  }
  budgets.forEach((list, side) => list.forEach(b => {
    let p = b.left;
    if (p <= 0) return;
    const shooter = isShooter(b.p);
    const threes = Math.min(Math.floor(p / 3), Math.max(0, Math.round(p * (shooter ? 0.33 : 0.1) / 3 + normal() * 0.6)));
    let rem = p - 3 * threes;
    const ft1 = rem % 2;
    const ftPairs = Math.min(Math.floor((rem - ft1) / 2), Math.round(rem * 0.08));
    const twos = (rem - ft1 - 2 * ftPairs) / 2;
    const add = (n, value, kind) => { for (let i = 0; i < n; i++) events.push({ side, p: b.p, value, kind, t: rand() * 47.9 }); };
    add(threes, 3, '3'); add(twos, 2, '2'); add(ftPairs, 2, 'ft2'); add(ft1, 1, 'ft1');
    b.left = 0;
  }));
  return events.sort((x, y) => x.t - y.t);
}
function playText(e) {
  const n = shortName(e.p.generic ? 'Bench' : e.p.name);
  if (e.kind === '3') return pick([`${n} drains a three`, `${n} from deep: good`, `${n} hits the triple`]);
  if (e.kind === 'ft2') return `${n} makes both free throws`;
  if (e.kind === 'ft1') return `${n} hits a free throw`;
  const big = e.p.pos === 'C' || e.p.pos === 'PF';
  return `${n} ${pick(big ? ['dunks it', 'scores inside', 'hook shot, good', 'putback'] : ['pull-up jumper', 'layup', 'floater drops', 'mid-range jumper'])}`;
}

function gameScore(l) { return l.pts + 0.4 * l.fgm - 0.7 * l.fga + 0.7 * l.reb + 0.7 * l.ast + l.stl + 0.7 * l.blk; }

function simGame(home, away) {
  const diff = home.rating - away.rating + HOME_EDGE;
  let m = Math.round(MARGIN_K * diff + MARGIN_SD * normal());
  let ot = false;
  if (m === 0) {
    ot = true;
    const extra = 1 + Math.floor(rand() * 6);
    m = rand() < winProb(home, away, HOME_EDGE) ? extra : -extra;
  }
  const total = home.pace + away.pace + 9 * normal() + (ot ? 10 : 0);
  const hs = Math.round((total + m) / 2);
  const as = hs - m;
  return { home, away, hs, as, ot, hb: boxScore(home, hs), ab: boxScore(away, as) };
}

function newAcc() { return { gp: 0, pts: 0, reb: 0, ast: 0, stl: 0, blk: 0, fgm: 0, fga: 0, hi: 0, gs: 0 }; }
function addLine(acc, l) {
  acc.gp++; acc.pts += l.pts; acc.reb += l.reb; acc.ast += l.ast; acc.stl += l.stl; acc.blk += l.blk;
  acc.fgm += l.fgm; acc.fga += l.fga; acc.hi = Math.max(acc.hi, l.pts); acc.gs += gameScore(l);
}

function makeLeague(takenNames) {
  const key = [...takenNames].sort().join('|');
  if (!leagueCache.has(key)) { if (leagueCache.size > 50) leagueCache.clear(); leagueCache.set(key, TEAMS.map(t => buildRealTeam(t, takenNames))); }
  return leagueCache.get(key).map(t => ({ ...t }));
}

function legendsFrom(league) {
  const out = [];
  ERAS.forEach(e => {
    league.filter(t => t.era === e).sort((a, b) => b.rating - a.rating).slice(0, 3).forEach(t => out.push(t));
  });
  return out;
}

function simSeason(user, league) {
  let order = [];
  while (order.length < 82) order = order.concat(league.slice().sort(() => rand() - 0.5));
  order = order.slice(0, 82);
  const games = [];
  const acc = {};
  user.starters.forEach(p => acc[p.name] = newAcc());
  let w = 0, l = 0;
  order.forEach((opp, i) => {
    const home = i % 2 === 0;
    const g = home ? simGame(user, opp) : simGame(opp, user);
    const us = home ? g.hs : g.as, them = home ? g.as : g.hs;
    const box = home ? g.hb : g.ab;
    box.slice(0, 5).forEach(line => addLine(acc[line.p.name], line));
    const won = us > them;
    won ? w++ : l++;
    games.push({ opp: opp.key, oppShort: opp.short, oppRating: opp.rating, home, us, them, ot: g.ot, won, w, l });
  });
  return { games, acc, w, l };
}

/* Postseason: seeds 1-6 go straight in, 7-10 play in for the last two spots, 11+ are out. Then an 8-team bracket. */
const BRACKET_ORDER = [1, 8, 4, 5, 3, 6, 2, 7];
const ROUND_NAMES = ['First round', 'Semifinals', 'Finals'];
const DIRECT_SEEDS = 6, PLAYIN_LAST = 10;

function seedField(user, wins, legends, league) {
  const entries = [{ team: user, wins }].concat(legends.map(t => ({ team: t, wins: Math.round(expectedWins(t, league)) })));
  entries.sort((a, b) => b.wins - a.wins || b.team.rating - a.team.rating);
  entries.forEach((e, i) => e.seed = i + 1);
  return entries;
}

function newSeries(a, b, need = 4) { return { a, b, need, games: [], wa: 0, wb: 0, done: false, winner: null }; }
const seriesLoser = s => (s.winner === s.a ? s.b : s.a);
const HOME_PATTERN = [0, 0, 1, 1, 0, 1, 0]; // 0 = higher seed (a) at home

function playSeriesGame(s, adjA = 0, adjB = 0) {
  if (s.done) return null;
  const n = s.games.length;
  const aHome = HOME_PATTERN[n] === 0;
  const A = adjA ? { ...s.a.team, rating: s.a.team.rating + adjA } : s.a.team;
  const B = adjB ? { ...s.b.team, rating: s.b.team.rating + adjB } : s.b.team;
  const g = aHome ? simGame(A, B) : simGame(B, A);
  const aPts = aHome ? g.hs : g.as, bPts = aHome ? g.as : g.hs;
  const aBox = aHome ? g.hb : g.ab, bBox = aHome ? g.ab : g.hb;
  const rec = { n: n + 1, aHome, aPts, bPts, ot: g.ot, aBox, bBox };
  s.games.push(rec);
  aPts > bPts ? s.wa++ : s.wb++;
  const need = s.need || 4;
  if (s.wa === need || s.wb === need) { s.done = true; s.winner = s.wa === need ? s.a : s.b; }
  return rec;
}
function finishSeries(s) { while (!s.done) playSeriesGame(s); }

// Where the player in slot `from` could go: { slotIndex: 'move' | 'swap' | reason-it-cannot }.
function moveTargets(from) {
  const players = picksPlayers(), src = players.find(x => x.pos === POS_ORDER[from]);
  const out = {};
  if (!src) return out;
  POS_ORDER.forEach((pos, i) => {
    if (i === from) return;
    const other = players.find(x => x.pos === pos);
    if (!posOf(src).includes(pos)) out[i] = `${shortName(src.name)} can't play ${pos}`;
    else if (!other) out[i] = 'move';
    else if (!posOf(other).includes(POS_ORDER[from])) out[i] = `${shortName(other.name)} can't play ${POS_ORDER[from]}`;
    else out[i] = 'swap';
  });
  return out;
}
function lineupStrip(players) {
  // One slot per position. Tap a rating to pick a player up, then tap a highlighted slot to move or swap him.
  // After a roll (and when nothing is picked up), open slots this roster can fill are highlighted.
  const d = S.draft;
  const moving = UI.moveFrom != null && players.some(x => x.pos === POS_ORDER[UI.moveFrom]);
  const targets = moving ? moveTargets(UI.moveFrom) : {};
  const rolled = !moving && d && d.rolled != null && !d.spinning ? TEAMS[d.rolled] : null;
  const fillable = new Set(rolled ? rolled.players.filter(x => !pickBlock(x)).flatMap(openFor) : []);
  const pops = [].concat(UI.popSlot ?? []);
  const slots = POS_ORDER.map((pos, i) => {
    const p = players.find(x => x.pos === pos);
    const tgt = targets[i];
    const ok = tgt === 'move' || tgt === 'swap';
    const moveCls = moving ? (i === UI.moveFrom ? 'moving' : ok ? 'target' : 'blocked') : '';
    const label = moving && i !== UI.moveFrom ? (ok ? (tgt === 'swap' ? 'Swap' : 'Move here') : '') : '';
    const title = moving && !ok && i !== UI.moveFrom ? tgt : '';
    if (p) return `<button class="s5 ${pops.includes(i) ? 'pop' : ''} ${UI.incoming === i ? 'incoming' : ''} ${moveCls}" data-action="slot" data-i="${i}" data-slot="${i}" style="--era:${ERA_INFO[p.era].color}" ${title ? `title="${esc(title)}"` : ''} aria-label="${esc(p.name)}, ${pos}${moving && i === UI.moveFrom ? ', picked up' : ''}"><span class="ring">${p.ovr}</span><small><i>${pos}</i>${label ? `<em>${label}</em>` : esc(shortName(p.name))}</small></button>`;
    if (moving) return `<button class="s5 open ${moveCls}" data-action="slot" data-i="${i}" data-slot="${i}" ${title ? `title="${esc(title)}"` : ''}><span class="ring pos">${pos}</span><small>${label ? `<em>${label}</em>` : 'Open'}</small></button>`;
    if (fillable.has(pos)) return `<span class="s5 open current" data-slot="${i}"><span class="ring pos">${pos}</span><small>On roster</small></span>`;
    return `<span class="s5 open ${rolled ? '' : 'ready'}" data-slot="${i}"><span class="ring pos">${pos}</span><small>Open</small></span>`;
  }).join('');
  const hint = moving
    ? `Tap a highlighted slot to move ${esc(shortName(players.find(x => x.pos === POS_ORDER[UI.moveFrom]).name))} · tap him again to cancel`
    : players.length ? 'Tap a rating to change a player’s position' : '';
  return `<div class="card strip5 ${moving ? 'is-moving' : ''}">
    <span class="strip5-head"><span>Your five</span><button class="more-btn" data-action="sheet" data-sheet="team">${players.length ? `<b>${f1(lineupRating(players))}</b>` : ''}<span class="more">Details ›</span></button></span>
    <span class="s5row">${slots}</span>
    ${hint ? `<span class="strip5-hint">${hint}</span>` : ''}</div>`;
}
function moveSlot(from, to) {
  const t = moveTargets(from)[to];
  if (t !== 'move' && t !== 'swap') { if (t) toast(t); return; }
  const picks = S.draft.picks;
  const pa = picks.find(r => (r.pos || TEAMS[r.t].players[r.i].pos) === POS_ORDER[from]);
  const pb = picks.find(r => (r.pos || TEAMS[r.t].players[r.i].pos) === POS_ORDER[to]);
  pa.pos = POS_ORDER[to];
  if (pb) pb.pos = POS_ORDER[from];
  UI.moveFrom = null;
  UI.popSlot = pb ? [to, from] : [to];
  const na = shortName(TEAMS[pa.t].players[pa.i].name);
  toast(pb ? `Swapped ${na} (${POS_ORDER[to]}) and ${shortName(TEAMS[pb.t].players[pb.i].name)} (${POS_ORDER[from]})` : `Moved ${na} to ${POS_ORDER[to]}`);
}

function capBar() {
  const D = curDiff();
  if (!D.cap) return '';
  const used = capUsed(), picks = S.draft.picks;
  return `<div class="capbar"><div class="lab"><span>Salary cap (total OVR)</span><b>${used} / ${D.cap}</b></div>

}
function openPositions() { const have = picksPlayers().map(p => p.pos); return POS_ORDER.filter(pos => !have.includes(pos)); }
function openFor(p) { const open = openPositions(); return posOf(p).filter(x => open.includes(x)); }
function pickBlock(p) {
  if (!openFor(p).length) { const ps = posOf(p); return `${ps.join('/')} ${ps.length > 1 ? 'spots are' : 'spot is'} already filled`; }
  if (takenNames().has(p.name)) return 'Already on your team (from another team or era)';
  const max = maxPickOvr(curDiff(), S.draft.picks);
  if (p.ovr > max) return `Over the cap: ${max} OVR max on this pick`;
  return '';
}
function switchBlock(k) {
  const D = DIFFS[k];
  if (S.screen !== 'draft' || !D.cap) return '';
  const picks = S.draft.picks;
  if (picks.length >= 5) return '';
  return maxPickOvr(D, picks) < CAP_RESERVE ? `Your picks already use too much of the ${D.cap} cap` : '';
}
