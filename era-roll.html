<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0C1016">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Era Roll Basketball</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Big+Shoulders+Display:wght@600;800;900&family=Chivo+Mono:wght@400;600&display=swap">
<style>
  /* Layout: a phone app. Fixed top bar, one scrolling column, a fixed bottom action bar within thumb reach,
     bottom sheets for details. Arena-at-night look: maple floor on the home screen, LED scoreboard panels.
     Single dark look by choice. */
  :root {
    --night:   #0C1016;
    --panel:   #151B24;
    --panel-2: #1D2531;
    --line:    #2A3341;
    --chalk:   #ECEFF3;
    --muted:   #95A1B2;
    --faint:   #5F6B7C;
    --maple:   #D59C60;
    --maple-2: #BF8247;
    --maple-3: #C98F55;
    --floor-ink: #22150A;
    --court-line: rgba(255, 250, 240, 0.62);
    --led:     #FFB627;   /* accent: follows difficulty (see [data-diff] below) */
    --led-soft:#A47A1D;
    --reel-bg: #12100A;
    --reel-line: #2B2410;
    --board:   #090B0F;
    --win:     #45C482;
    --loss:    #E65B50;
    --e80: #2EC4B6;
    --e90: #B583FF;
    --e00: #4EA8FF;
    --e10: #FF7A59;
    --e20: #F2689F;

    --display: "Big Shoulders Display", Impact, "Arial Narrow", sans-serif;
    --body: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "Chivo Mono", ui-monospace, Menlo, Consolas, monospace;
    --bar-h: 56px;
    color-scheme: dark;
  }

  /* Difficulty themes: Rookie sky blue, Pro arena amber, Hall of Fame violet. */
  @property --led { syntax: '<color>'; inherits: true; initial-value: #FFB627; }
  @property --led-soft { syntax: '<color>'; inherits: true; initial-value: #A47A1D; }
  :root { transition: --led .35s ease, --led-soft .35s ease; }
  :root[data-diff="rookie"] { --led: #5CC8FF; --led-soft: #3B87AE; --reel-bg: #091117; --reel-line: #173244; }
  :root[data-diff="pro"]    { --led: #FFB627; --led-soft: #A47A1D; --reel-bg: #12100A; --reel-line: #2B2410; }
  :root[data-diff="hof"]    { --led: #C38BFF; --led-soft: #8459B3; --reel-bg: #100C17; --reel-line: #2D2040; }

  * { box-sizing: border-box; }
  html, body { background: var(--night); color: var(--chalk); }
  /* Always reserve the page scrollbar so screens of different lengths never shift sideways. */
  html { overflow-y: scroll; scrollbar-gutter: stable; }
  body {
    margin: 0; font-family: var(--body); font-size: 15px; line-height: 1.45;
    -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none;
  }
  button { font: inherit; color: inherit; cursor: pointer; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  button:disabled { cursor: not-allowed; }
  :focus-visible { outline: 2px solid var(--led); outline-offset: 2px; }
  h1, h2, h3 { margin: 0; text-wrap: balance; }
  p { margin: 0; }
  .muted { color: var(--muted); font-size: 14px; }
  .fine { color: var(--faint); font-size: 12px; }

  .wrap-x { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .col { max-width: 760px; margin: 0 auto; }
  .stack { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .stack > * { min-width: 0; }
  .sec { font-family: var(--display); font-weight: 800; font-size: 17px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .sec-sub { font-family: var(--body); font-size: 12px; letter-spacing: 0; text-transform: none; font-weight: 600; color: var(--faint); }
  .card { background: var(--panel); border-radius: 16px; padding: 14px; min-width: 0; }

  /* ---------- app bar ---------- */
  .appbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    padding-top: env(safe-area-inset-top, 0px);
    background: rgba(12, 16, 22, .94); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  .appbar .bar-in {
    height: var(--bar-h); max-width: 760px; margin: 0 auto;
    display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 6px; align-items: center;
    padding-left: max(6px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  }
  .icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: transparent; border-radius: 12px; color: var(--chalk); }
  .icon-btn:active { background: var(--panel-2); }
  .ttl { min-width: 0; }
  .ttl b { display: block; font-family: var(--display); font-weight: 800; font-size: 23px; letter-spacing: .03em; text-transform: uppercase; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ttl small { display: block; font-size: 12px; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip-btn {
    border: 1.5px solid var(--led); color: var(--led); background: transparent; border-radius: 999px;
    min-height: 34px; padding: 0 12px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap;
  }
  .chip-btn:active { background: color-mix(in srgb, var(--led) 14%, transparent); }
  .stagebar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; height: 3px; max-width: 760px; margin: 0 auto; }
  .stagebar i { background: var(--line); }
  .stagebar i.on { background: var(--led); }

  .content { padding-top: calc(env(safe-area-inset-top, 0px) + var(--bar-h) + 18px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 110px); }
  .content.enter, .home.enter { animation: enter .28s cubic-bezier(.2, .8, .2, 1); }
  @keyframes enter { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }

  /* ---------- action bar ---------- */
  .actionbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    padding-top: 22px; padding-bottom: max(14px, env(safe-area-inset-bottom, 0px));
    background: linear-gradient(to top, var(--night) 62%, rgba(12, 16, 22, 0));
    pointer-events: none;
  }
  .actionbar .bar-in { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; pointer-events: auto; }
  .abtn {
    flex: 1; min-height: 54px; border: 0; border-radius: 14px; padding: 0 14px;
    font-family: var(--display); font-weight: 800; font-size: 20px; letter-spacing: .05em; text-transform: uppercase; line-height: 1;
    background: var(--panel-2); color: var(--chalk); box-shadow: inset 0 0 0 1.5px var(--line);
    transition: transform .1s ease;
  }
  .abtn.primary { flex: 1.7; background: var(--led); color: var(--night); box-shadow: 0 8px 24px color-mix(in srgb, var(--led) 22%, transparent); }
  .abtn.danger { background: var(--loss); color: var(--night); box-shadow: none; }
  .abtn.block { width: 100%; }
  .abtn:active:not(:disabled) { transform: scale(.97); }
  .abtn:disabled { opacity: .42; box-shadow: inset 0 0 0 1.5px var(--line); }
  .abtn.primary:disabled { background: var(--panel-2); color: var(--muted); }

  /* ---------- shared pieces ---------- */
  .ovr {
    width: 48px; height: 48px; flex: none; display: grid; place-items: center; border-radius: 12px;
    background: var(--board); color: var(--led); font-family: var(--display); font-weight: 900; font-size: 24px; line-height: 1;
    text-shadow: 0 0 10px color-mix(in srgb, var(--led) 40%, transparent); box-shadow: inset 0 -3px 0 var(--era, transparent);
  }
  .ovr.sm { font-size: 17px; }
  .ovr.big { width: 64px; height: 64px; font-size: 34px; border-radius: 16px; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
  .tag { font-size: 10px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; background: var(--panel-2); color: var(--led); }
  .why { display: block; font-size: 12px; color: var(--loss); font-weight: 600; margin-top: 4px; }
  .empty { text-align: center; color: var(--muted); padding: 26px 12px; border: 1.5px dashed var(--line); border-radius: 16px; font-size: 14px; }

  .list { display: grid; gap: 8px; }
  .prow, .lrow {
    display: grid; grid-template-columns: 48px minmax(0, 1fr) 14px; gap: 12px; align-items: center;
    width: 100%; text-align: left; border: 0; border-radius: 14px; padding: 10px 12px; min-height: 68px;
    background: var(--panel); color: var(--chalk);
  }
  .lrow { grid-template-columns: 48px minmax(0, 1fr); }
  button.prow:active { background: var(--panel-2); }
  .prow.off { opacity: .5; }
  .pmain { min-width: 0; }
  .pmain b { display: block; font-size: 16px; font-weight: 700; line-height: 1.2; }
  .pmeta { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
  .chev { color: var(--faint); font-size: 24px; line-height: 1; }
  .link-btn {
    flex: none; align-self: center; min-height: 36px; padding: 0 12px; border-radius: 999px;
    border: 1px solid var(--line); background: transparent; color: var(--muted);
    font-family: var(--body); font-size: 13px; font-weight: 600; letter-spacing: 0; text-transform: none;
  }
  .link-btn:active:not(:disabled) { background: var(--panel-2); }
  .link-btn:disabled { opacity: .45; }

  .need { flex: none; display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 999px; background: var(--panel); font-size: 13px; font-weight: 600; white-space: nowrap; }
  .need i { width: 8px; height: 8px; border-radius: 50%; background: var(--win); }
  .need.bad i { background: var(--loss); }
  .need.plus i { background: var(--led); }
  .need.pending { color: var(--muted); }
  .need.pending i { background: transparent; box-shadow: inset 0 0 0 1.5px var(--faint); }
  .needs { display: flex; gap: 6px; overflow-x: scroll; scrollbar-width: none; margin: 0 -16px; padding: 0 16px 2px; }
  .needs::-webkit-scrollbar { display: none; }

  .fit { margin: 0; padding: 0; list-style: none; display: grid; gap: 9px; font-size: 14px; }
  .fit li { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; }
  .fit .mk { width: 8px; height: 8px; border-radius: 50%; background: var(--win); transform: translateY(-1px); }
  .fit li.bad .mk { background: var(--loss); }
  .fit li.plus .mk { background: var(--led); }
  .fit li.pending .mk { background: transparent; box-shadow: inset 0 0 0 1.5px var(--faint); }
  .fit b { font-weight: 600; }
  .fit .d { display: block; color: var(--muted); font-size: 12px; }
  .fit em { font-style: normal; font-family: var(--mono); font-size: 13px; color: var(--win); }
  .fit li.bad em { color: var(--loss); }
  .fit li.plus em { color: var(--led); }

  .capbar { display: grid; gap: 6px; }
  .capbar .lab { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); }
  .capbar .lab b { color: var(--chalk); font-family: var(--mono); font-weight: 600; }
  .capbar .bar { height: 8px; background: var(--panel-2); border-radius: 99px; overflow: hidden; }
  .capbar .bar i { display: block; height: 100%; background: var(--e00); border-radius: 99px; }

  /* ---------- LED board ---------- */
  .board { background: var(--board); border-radius: 18px; padding: 12px; color: var(--led); box-shadow: inset 0 0 0 1px var(--reel-line); }
  .reels { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .reel { background: var(--reel-bg); border-radius: 10px; padding: 8px 10px; min-width: 0; box-shadow: inset 0 0 0 1px var(--reel-line); }
  .reel.wide { grid-column: 1 / -1; }
  .reel .k { font-family: var(--display); font-weight: 700; font-size: 11px; letter-spacing: .2em; color: var(--led-soft); }
  .reel .v { font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1.05; text-transform: uppercase; text-shadow: 0 0 12px color-mix(in srgb, var(--led) 45%, transparent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .reel.spin .v { animation: flick .08s steps(2) infinite; }
  @keyframes flick { 50% { opacity: .55; } }
  .capline { display: flex; justify-content: space-between; gap: 6px 12px; flex-wrap: wrap; margin-top: 10px; font-family: var(--mono); font-size: 12px; color: var(--led-soft); }
  .capline b { color: var(--led); font-weight: 600; }

  /* game transitions: a two-layer slab wipes across with a title card */
  .wipe { position: fixed; inset: 0; z-index: 60; overflow: hidden; }
  .wipe .slab { position: absolute; top: -20%; bottom: -20%; left: -70%; right: -70%; transform: translateX(125%) skewX(-14deg); animation: wipeIn .42s cubic-bezier(.75, 0, .25, 1) forwards; }
  .wipe .slab.dark { background: var(--board); box-shadow: inset 8px 0 0 var(--led); }
  .wipe .slab.lit {
    animation-delay: .07s; display: grid; place-items: center; color: var(--night);
    background: repeating-linear-gradient(90deg, transparent 0 46px, rgba(0, 0, 0, .07) 46px 49px), var(--led);
  }
  .wipe.loss .slab.dark { box-shadow: inset 8px 0 0 var(--loss); }
  .wipe.loss .slab.lit { background: repeating-linear-gradient(90deg, transparent 0 46px, rgba(0, 0, 0, .07) 46px 49px), var(--loss); }
  .wipe-in { transform: skewX(14deg); text-align: center; display: grid; gap: 8px; padding: 0 28px; max-width: 100vw; opacity: 0; animation: wipeText .45s cubic-bezier(.2, .8, .2, 1) .32s forwards; }
  .wipe-in .kicker { font-family: var(--display); font-weight: 800; font-size: 15px; letter-spacing: .32em; text-transform: uppercase; }
  .wipe-in b { font-family: var(--display); font-weight: 900; font-size: clamp(48px, 16vw, 148px); line-height: .85; text-transform: uppercase; white-space: nowrap; }
  .wipe-in b.long { font-size: clamp(40px, 12.5vw, 120px); }
  .wipe-in .sub { font-weight: 700; font-size: 15px; }
  .wipe-in .note { font-weight: 600; font-size: 13px; opacity: .7; }
  .wipe.out .slab { animation: wipeOut .4s cubic-bezier(.75, 0, .25, 1) forwards; }
  .wipe.out .slab.dark { animation-delay: .07s; }
  @keyframes wipeIn { from { transform: translateX(125%) skewX(-14deg); } to { transform: translateX(0) skewX(-14deg); } }
  @keyframes wipeOut { from { transform: translateX(0) skewX(-14deg); } to { transform: translateX(-135%) skewX(-14deg); } }
  @keyframes wipeText { from { opacity: 0; transform: skewX(14deg) translateX(48px) scale(.94); } to { opacity: 1; transform: skewX(14deg); } }
  .s5.pop .ring { animation: slotPop .5s cubic-bezier(.3, 1.6, .5, 1), slotBurst .7s ease-out; }
  @keyframes slotBurst {
    0% { box-shadow: 0 0 0 2px var(--era), 0 0 0 0 color-mix(in srgb, var(--led) 75%, transparent); }
    100% { box-shadow: 0 0 0 2px var(--era), 0 0 0 18px color-mix(in srgb, var(--led) 0%, transparent); }
  }
  .s5.incoming { visibility: hidden; }
  .flyer {
    position: fixed; z-index: 70; pointer-events: none; display: grid; place-items: center; transform-origin: center;
    background: var(--board); color: var(--led); font-family: var(--display); font-weight: 900; font-size: 34px; line-height: 1;
    box-shadow: 0 0 0 2px var(--era), 0 14px 34px rgba(0, 0, 0, .55), 0 0 30px color-mix(in srgb, var(--led) 35%, transparent);
    text-shadow: 0 0 12px color-mix(in srgb, var(--led) 50%, transparent);
  }
  .reel .v { transform-origin: left center; }
  .reel.lock { animation: reelFlash .7s ease-out; }
  .reel.lock .v { animation: stamp .45s cubic-bezier(.3, 1.5, .5, 1); }
  @keyframes stamp { 0% { transform: scale(1.6); opacity: 0; filter: blur(3px); } 55% { opacity: 1; filter: none; } 100% { transform: none; } }
  @keyframes reelFlash {
    0% { box-shadow: inset 0 0 0 1px var(--reel-line), 0 0 0 2px var(--led), 0 0 28px color-mix(in srgb, var(--led) 55%, transparent); }
    100% { box-shadow: inset 0 0 0 1px var(--reel-line), 0 0 0 0 transparent; }
  }
  .cascade > * { animation: rowIn .4s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i) * 45ms + 260ms); }
  @keyframes rowIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  .pickhero .big-ring.done { animation: none; font-size: 56px; }
  .vs.hit-w { animation: hitW .8s ease-out; }
  .vs.hit-l { animation: hitL .8s ease-out; }
  @keyframes hitW { 0% { box-shadow: 0 0 0 2px var(--led), 0 0 44px color-mix(in srgb, var(--led) 50%, transparent); } 100% { box-shadow: 0 0 0 0 transparent; } }
  @keyframes hitL {
    0% { box-shadow: 0 0 0 2px var(--loss), 0 0 44px color-mix(in srgb, var(--loss) 45%, transparent); transform: translateX(-6px); }
    12% { transform: translateX(6px); } 24% { transform: translateX(-4px); } 36% { transform: translateX(2px); } 48% { transform: none; }
    100% { box-shadow: 0 0 0 0 transparent; }
  }
  .vs .sc.flip { animation: flip .55s cubic-bezier(.3, 1.4, .5, 1) .1s both; }
  @keyframes flip { 0% { transform: perspective(300px) rotateX(90deg); opacity: 0; } 100% { transform: none; opacity: 1; } }
  .lastres.stamp { animation: stampIn .45s cubic-bezier(.3, 1.5, .5, 1) .25s both; }
  @keyframes stampIn { 0% { transform: scale(1.18); opacity: 0; } 100% { transform: none; opacity: 1; } }
  @keyframes slotPop { 0% { transform: scale(.2); } 100% { transform: scale(1); } }
  .board.land { animation: boardLand .55s cubic-bezier(.2, .8, .2, 1); }
  @keyframes boardLand {
    0% { transform: scale(1.035); box-shadow: inset 0 0 0 1px var(--reel-line), 0 0 0 2px var(--led), 0 0 44px color-mix(in srgb, var(--led) 45%, transparent); }
    100% { transform: none; box-shadow: inset 0 0 0 1px var(--reel-line), 0 0 0 0 transparent; }
  }

  /* pre-roll pick card and budget */
  .pickhero {
    display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: center;
    background: var(--board); border-radius: 18px; padding: 18px; box-shadow: inset 0 0 0 1px var(--reel-line);
  }
  .pickhero .big-ring {
    width: 108px; height: 108px; border-radius: 50%; display: grid; place-items: center;
    border: 3px solid var(--led); background: color-mix(in srgb, var(--led) 12%, transparent);
    font-family: var(--display); font-weight: 900; font-size: 70px; line-height: 1; color: var(--led);
    text-shadow: 0 0 18px color-mix(in srgb, var(--led) 55%, transparent);
    animation: slotPulse 1.6s ease-in-out infinite;
  }
  .pickhero .k { display: block; font-family: var(--display); font-weight: 700; font-size: 12px; letter-spacing: .2em; color: var(--led-soft); }
  .pickhero b { display: block; font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1; text-transform: uppercase; margin: 6px 0 6px; }
  .pickhero .d { display: block; font-size: 13px; color: var(--muted); }
  .budget { display: grid; gap: 10px; }
  .btiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btiles > div { background: var(--panel-2); border-radius: 12px; padding: 10px 12px; display: grid; gap: 1px; }
  .btiles .k { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
  .btiles b { font-family: var(--mono); font-weight: 600; font-size: 30px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .btiles b.hi { color: var(--led); }
  .btiles .d { font-size: 12px; color: var(--muted); }
  .budget .bar { height: 6px; background: var(--panel-2); border-radius: 99px; overflow: hidden; }
  .budget .bar i { display: block; height: 100%; background: var(--led); border-radius: 99px; }
  .budget-line { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .budget-line .need { font-weight: 500; color: var(--muted); }
  .budget-line .need b { font-family: var(--mono); font-weight: 600; color: var(--chalk); }
  .budget-line .need:first-child b { color: var(--led); }

  /* draft dock: lineup + needs stay pinned under the app bar and compact once the page scrolls */
  .dock {
    position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--bar-h) + 3px); z-index: 8;
    display: grid; gap: 10px; margin: -10px -16px 0; padding: 10px 16px; background: var(--night);
    transition: box-shadow .2s ease;
  }
  .dock.compact { box-shadow: 0 12px 18px -10px rgba(0, 0, 0, .7); }
  .dock .strip5 { transition: padding .2s ease; }
  .dock.compact .strip5 { padding: 8px 10px; gap: 0; }
  .dock.compact .strip5-head { display: none; }
  .dock.compact .s5 .ring { width: 38px; height: 38px; font-size: 17px; }
  .dock.compact .s5 small { display: none; }
  .s5 .ring { transition: width .2s ease, height .2s ease, font-size .2s ease; }

  /* lineup strip */
  .strip5 { display: grid; gap: 10px; width: 100%; border: 0; text-align: left; color: var(--chalk); }
  .strip5:active { background: var(--panel-2); }
  .strip5-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-family: var(--display); font-weight: 800; font-size: 17px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* Team fit. Rows always describe the lineup; deltas only count once all five are in. */
function chemistry(starters) {
  const full = starters.length === 5;
  const rows = [];
  const add = (label, detail, delta, ok) => rows.push({ label, detail, delta: full ? delta : 0, status: !full ? (ok ? 'ok' : 'pending') : delta > 0 ? 'plus' : delta < 0 ? 'bad' : 'ok' });
  const names = f => starters.filter(f).map(p => p.name.split(' ').slice(-1)[0]).join(', ');

  const sc = starters.filter(isScorer).length;
  add('Go-to scoring', sc === 0 ? 'No 24+ PPG scorer' : sc <= 2 ? `${sc} scorer${sc > 1 ? 's' : ''}: ${names(isScorer)}` : `${sc} scorers share one ball`,
      sc === 0 ? -1.5 : sc <= 2 ? 0 : -2 * (sc - 2), sc >= 1 && sc <= 2);
  const pm = starters.filter(isPlaymaker).length;
  add('Playmaking', pm ? names(isPlaymaker) : 'Nobody averages 6+ assists', pm ? 0 : -1.5, pm > 0);
  const sh = starters.filter(isShooter).length;
  add('Spacing', `${sh} shooter${sh === 1 ? '' : 's'}${sh ? ': ' + names(isShooter) : ''}`, sh === 0 ? -2 : sh === 1 ? -1 : sh === 2 ? 0 : 1, sh >= 2);
  const rp = starters.filter(isRim).length;
  add('Rim protection', rp ? names(isRim) : 'Nobody averages 1.5+ blocks', rp ? 0 : -1.5, rp > 0);
  const reb = starters.reduce((s2, p) => s2 + p.reb, 0);
  add('Rebounding', `${f1(reb)} per game from the starters (28 needed)`, reb < 28 ? -1.5 : reb >= 36 ? 0.5 : 0, reb >= 28);
  const st = starters.filter(isStopper).length;
  if (st) add('Perimeter defense', names(isStopper), 0.5, true);
  const guards = starters.filter(p => p.pos === 'PG' || p.pos === 'SG').length;
  const bigs = starters.filter(p => p.pos === 'PF' || p.pos === 'C').length;
  if (guards >= 4) add('Size', `${guards} guards`, -1, false);
  if (bigs >= 4) add('Spacing inside', `${bigs} bigs crowd the paint`, -1, false);
  if (full && new Set(starters.map(p => p.era)).size === 1) add('Era chemistry', 'All five from one era', 1, true);
  if (full && rows.slice(0, 5).every(r => r.delta >= 0)) add('Complete team', 'Scoring, playmaking, spacing, rim protection and rebounding covered', 1, true);
  const bonus = rows.reduce((s2, r) => s2 + r.delta, 0);
  return { bonus, rows };
}

const TRAITS = [
  { k: 'rim',   label: 'Rim protection',    invert: true },
  { k: 'reb',   label: 'Rebounding',        invert: true },
  { k: 'star',  label: 'Star reliance',     invert: false },
  { k: 'perim', label: 'Perimeter defense', invert: true },
];
function teamTraits(team) {
  const st = team.starters.filter(p => !p.generic);
  const pts = st.map(p => p.pts);
  return {
    rim: Math.max(...st.map(p => p.blk)),
    reb: st.reduce((a, p) => a + p.reb, 0),
    star: Math.max(...pts) / pts.reduce((a, x) => a + x, 0),
    perim: st.reduce((a, p) => a + p.stl, 0),
  };
}
function traitNorm(teams) {
  const n = {};
  TRAITS.forEach(t => {
    const xs = teams.map(tm => teamTraits(tm)[t.k]);
    n[t.k] = { min: Math.min(...xs), max: Math.max(...xs) };
  });
  return n;
}
function vulnerability(team, norm) {
  const tr = teamTraits(team), v = {};
  TRAITS.forEach(t => {
    const { min, max } = norm[t.k];
    const x = max > min ? (tr[t.k] - min) / (max - min) : 0.5;
    v[t.k] = clamp(t.invert ? 1 - x : x, 0, 1);
  });
  return v;
}
function execution(team) {
  const st = team.starters;
  const bigPts = Math.max(0, ...st.filter(p => p.pos === 'PF' || p.pos === 'C').map(p => p.pts));
  return {
    paint: clamp((bigPts - 8) / 17, 0, 1),
    boards: clamp((st.reduce((a, p) => a + p.reb, 0) - 24) / 16, 0, 1),
    star: clamp((Math.max(...st.map(p => p.stl + 0.5 * p.blk)) - 0.8) / 1.7, 0, 1),
    space: clamp(st.filter(isShooter).length / 4, 0, 1),
  };
}
const RANK_EFFECT = [3.5, 1, -1.5, -3]; // their weakest trait first, their strongest last
function planEffect(plan, vuln, exec, repeats) {
  const order = TRAITS.map(t => t.k).sort((a, b) => vuln[b] - vuln[a]);
  const base = RANK_EFFECT[order.indexOf(plan.trait)];
  return (base > 0 ? base * (0.6 + 0.4 * exec[plan.k]) : base) - repeats;
}
function repeatsFor(series, planKey) {
  let k = 0;
  for (let i = series.games.length - 1; i >= 0 && series.games[i].plan === planKey; i--) k++;
  return k;
}

function rateLineup(starters, bench) {
  const chem = chemistry(starters);
  const r = 0.8 * avg(starters.map(p => p.ovr)) + 0.2 * avg(bench.map(p => p.ovr)) + chem.bonus;
  return { rating: r, chem };
}

function buildRealTeam(t, takenNames) {
  const pool = t.players.filter(p => !takenNames.has(p.name)).slice().sort((a, b) => b.ovr - a.ovr);
  const starters = pool.slice(0, 5);
  const bench = pool.slice(5, 8);
  let k = 0;
  while (bench.length < 3) bench.push(filler(k++));
  const { rating, chem } = rateLineup(starters, bench);
  return {
    key: 't' + t.id, src: t, label: teamLabel(t), short: teamShort(t), era: t.era,
    starters, bench, rating, chem, pace: ERA_INFO[t.era].pace,
  };
}

function buildUserTeam(picks, benchOvr) {

function winProb(a, b, edge) { return Phi(MARGIN_K * (a.rating - b.rating + edge) / MARGIN_SD); }

function expectedWins(team, league) {
  const others = league.filter(o => o.key !== team.key);
  return 82 * avg(others.map(o => winProb(team, o, 0)));
}

function boxScore(team, pts) {
  const roster = team.starters.concat(team.bench);
  const w = roster.map(p => Math.max(0.3, Math.pow(p.pts, 1.15) * (1 + 0.24 * normal())));
  const sw = w.reduce((s, x) => s + x, 0);
  return roster.map((p, i) => {
    const pp = Math.max(0, Math.round(pts * w[i] / sw));
    const fgm = Math.round(pp / 2.35);
    const pct = clamp((p.fg / 100) * (1 + 0.12 * normal()), 0.2, 0.85);
    const fga = Math.max(fgm, Math.round(fgm / pct));
    const cnt = x => Math.max(0, Math.round(x + normal() * Math.sqrt(Math.max(x, 0.2))));
    return {
      p, pts: pp, fgm, fga,
      reb: Math.max(0, Math.round(p.reb * (1 + 0.28 * normal()))),
      ast: Math.max(0, Math.round(p.ast * (1 + 0.3 * normal()))),
      stl: cnt(p.stl), blk: cnt(p.blk),
    };
  });
}

function gameScore(l) { return l.pts + 0.4 * l.fgm - 0.7 * l.fga + 0.7 * l.reb + 0.7 * l.ast + l.stl + 0.7 * l.blk; }

function simGame(home, away) {
  const diff = home.rating - away.rating + HOME_EDGE;
  let m = Math.round(MARGIN_K * diff + MARGIN_SD * normal());
  let ot = false;
  if (m === 0) {
    ot = true;
    const extra = 1 + Math.floor(rand() * 6);
    m = rand() < winProb(home, away, HOME_EDGE) ? extra : -extra;
  }
  const total = home.pace + away.pace + 9 * normal() + (ot ? 10 : 0);
  const hs = Math.round((total + m) / 2);
  const as = hs - m;
  return { home, away, hs, as, ot, hb: boxScore(home, hs), ab: boxScore(away, as) };
}

function newAcc() { return { gp: 0, pts: 0, reb: 0, ast: 0, stl: 0, blk: 0, fgm: 0, fga: 0, hi: 0, gs: 0 }; }
function addLine(acc, l) {
  acc.gp++; acc.pts += l.pts; acc.reb += l.reb; acc.ast += l.ast; acc.stl += l.stl; acc.blk += l.blk;
  acc.fgm += l.fgm; acc.fga += l.fga; acc.hi = Math.max(acc.hi, l.pts); acc.gs += gameScore(l);
}

function makeLeague(takenNames) { return TEAMS.map(t => buildRealTeam(t, takenNames)); }

function legendsFrom(league) {
  const out = [];
  ERAS.forEach(e => {
    league.filter(t => t.era === e).sort((a, b) => b.rating - a.rating).slice(0, 3).forEach(t => out.push(t));
  });
  return out;
}

function simSeason(user, league) {
  let order = [];
  while (order.length < 82) order = order.concat(league.slice().sort(() => rand() - 0.5));
  order = order.slice(0, 82);
  const games = [];
  const acc = {};
  user.starters.forEach(p => acc[p.name] = newAcc());
  let w = 0, l = 0;
  order.forEach((opp, i) => {
    const home = i % 2 === 0;
    const g = home ? simGame(user, opp) : simGame(opp, user);
    const us = home ? g.hs : g.as, them = home ? g.as : g.hs;
    const box = home ? g.hb : g.ab;
    box.slice(0, 5).forEach(line => addLine(acc[line.p.name], line));
    const won = us > them;
    won ? w++ : l++;
    games.push({ opp: opp.key, oppShort: opp.short, oppRating: opp.rating, home, us, them, ot: g.ot, won, w, l });
  });
  return { games, acc, w, l };
}

function seedField(user, wins, legends, league) {
  const entries = [{ team: user, wins }].concat(legends.map(t => ({ team: t, wins: Math.round(expectedWins(t, league)) })));
  entries.sort((a, b) => b.wins - a.wins || b.team.rating - a.team.rating);
  entries.forEach((e, i) => e.seed = i + 1);
  return entries;
}

function newSeries(a, b) { return { a, b, games: [], wa: 0, wb: 0, done: false, winner: null }; }
const HOME_PATTERN = [0, 0, 1, 1, 0, 1, 0]; // 0 = higher seed (a) at home

function playSeriesGame(s, adjA = 0, adjB = 0) {
  if (s.done) return null;
  const n = s.games.length;
  const aHome = HOME_PATTERN[n] === 0;
  const A = adjA ? { ...s.a.team, rating: s.a.team.rating + adjA } : s.a.team;
  const B = adjB ? { ...s.b.team, rating: s.b.team.rating + adjB } : s.b.team;
  const g = aHome ? simGame(A, B) : simGame(B, A);
  const aPts = aHome ? g.hs : g.as, bPts = aHome ? g.as : g.hs;
  const aBox = aHome ? g.hb : g.ab, bBox = aHome ? g.ab : g.hb;
  const rec = { n: n + 1, aHome, aPts, bPts, ot: g.ot, aBox, bBox };
  s.games.push(rec);
  aPts > bPts ? s.wa++ : s.wb++;
  if (s.wa === 4 || s.wb === 4) { s.done = true; s.winner = s.wa === 4 ? s.a : s.b; }
  return rec;
}
function finishSeries(s) { while (!s.done) playSeriesGame(s); }

function pickBlock(p) {

function bracketView() {

      if (!s) { items += `<div class="match tbd"><div class="tm"><span class="sd"></span><span class="nm">TBD</span><span></span></div><div class="tm"><span class="sd"></span><span class="nm">TBD</span><span></span></div></div>`; continue; }
      const show = s.done || s.a.team.user || s.b.team.user;
      const row = (e, wins) => `<div class="tm ${s.done ? (s.winner === e ? 'win' : 'lose') : ''} ${e.team.user ? 'you' : ''}"><span class="sd">${e.seed}</span><span class="nm">${esc(entryName(e))}</span><span class="w">${show ? wins : ''}</span></div>`;
      items += `<div class="match">${row(s.a, s.wa)}${row(s.b, s.wb)}</div>`;
    }
    cols.push(`<div class="bcol"><h3>${ROUND_NAMES[r]}</h3>${items}</div>`);
  }
  return `<div class="bracket-wrap"><div class="bracket">${cols.join('')}</div></div>`;

function scoutView(team) {

  if (D.scout === 'none') return `<div class="card"><div class="sec">Scouting</div><p class="muted">Hall of Fame has no scouting summary. Read their roster below and choose the plan yourself.</p></div>`;
  const v = vulnerability(team, S.po.norm);
  const top = TRAITS.reduce((a, t) => v[t.k] > v[a.k] ? t : a, TRAITS[0]);
  const full = D.scout === 'full';
  return `<div class="scout-grid">${TRAITS.map(t => {
    const x = v[t.k];
    const label = t.k === 'star' ? (x >= 0.67 ? 'High' : x >= 0.34 ? 'Medium' : 'Low') : (x >= 0.67 ? 'Weak' : x >= 0.34 ? 'Average' : 'Strong');
    const cls = x >= 0.67 ? 'weak' : x < 0.34 ? 'strong' : '';
    return `<div class="trait ${full && t === top ? 'target' : ''}"><span class="k">${t.label}</span><span class="v ${cls}">${label}</span>
      ${full ? `<div class="bar"><i style="width:${Math.round((t.invert ? 1 - x : x) * 100)}%"></i></div>${t === top ? '<span class="k" style="color:var(--win)">Weakest spot</span>' : ''}` : ''}</div>`;
  }).join('')}</div>`;
}
function plansView(s, youTeam) {
  const P = S.po;
  const ex = execution(youTeam);
  const dots = x => { const n = Math.round(x * 4); return '●'.repeat(n) + '○'.repeat(4 - n); };
  return `<div class="plans">${PLANS.map(pl => {
    const r = repeatsFor(s, pl.k);
    return `<button class="plan" data-action="plan" data-k="${pl.k}" aria-pressed="${P.plan === pl.k}">
      <b>${pl.name}</b><span>Attacks ${pl.attacks}</span>
      <span>Execution <span class="dots" aria-label="${Math.round(ex[pl.k] * 4)} of 4">${dots(ex[pl.k])}</span></span>
      ${r ? `<span class="warn">Used ${r}× in a row: −${r}.0</span>` : ''}
    </button>`;
  }).join('')}</div>
  <p class="fine">Hitting their weakest spot is worth up to +3.5 rating for the game. Hitting their strongest costs 3. Check the Scout tab.</p>`;
}
function gameLine(s, g) {
  const youA = s.a.team.user;
  const yp = youA ? g.aPts : g.bPts, op = youA ? g.bPts : g.aPts;
  const ybox = (youA ? g.aBox : g.bBox).slice(0, 5);
  const yTop = ybox.slice().sort((a, b) => b.pts - a.pts)[0];
  const oTop = (youA ? g.bBox : g.aBox).slice().sort((a, b) => b.pts - a.pts)[0];
  const youHome = youA ? g.aHome : !g.aHome;
  const pl = PLANS.find(x => x.k === g.plan);
  return { won: yp > op, score: `${yp}–${op}${g.ot ? ' OT' : ''}`, where: youHome ? 'home' : 'away',
    plan: pl ? `${pl.name} ${g.eff >= 0 ? '+' : '−'}${f1(Math.abs(g.eff))}` : '',
    top: `${yTop.p.name} ${yTop.pts} pts, ${yTop.reb} reb, ${yTop.ast} ast · ${oTop.p.name} ${oTop.pts} pts` };
}

    + actionbar(s.done

      : [{ label: 'Sim rest', action: 'simseries', id: 'simseries-btn', disabled: !P.plan },

/* ======================= SHEETS ======================= */
function sheetPlayer(i) {
  const t = TEAMS[S.draft.rolled];
  const p = t.players[i];
  const why = pickBlock(p);
  const cur = picksPlayers();
  const before = chemistry(cur).rows, after = chemistry(cur.concat([p])).rows;
  const fills = after.filter(r => r.status === 'ok' && (before.find(b => b.label === r.label) || {}).status !== 'ok').map(r => NEED_SHORT[r.label] || r.label);
  const warns = [];
  if (isScorer(p) && cur.filter(isScorer).length >= 2) warns.push('Third 24+ PPG scorer: costs rating once your five is set');
  const guards = cur.concat([p]).filter(x => x.pos === 'PG' || x.pos === 'SG').length;
  const bigs = cur.concat([p]).filter(x => x.pos === 'PF' || x.pos === 'C').length;
  if (guards >= 4) warns.push('Fourth guard: costs size');
  if (bigs >= 4) warns.push('Fourth big: crowds the paint');
  const D = curDiff();
  return `<div class="sh-head" style="--era:${ERA_INFO[p.era].color}"><span class="ovr big" id="sheet-ovr">${p.ovr}</span>
      <div><h2>${esc(p.name)}</h2><span class="pmeta">${p.pos} · ${esc(teamLabel(t))}</span></div></div>
    ${statGrid(p)}
    ${tagsHtml(p)}
    <div class="fills">${fills.length ? fills.map(f => `<span class="need ok"><i></i>Fills: ${esc(f)}</span>`).join('') : '<span class="need pending"><i></i>Fills no open need</span>'}${warns.map(w => `<span class="need bad"><i></i>${esc(w)}</span>`).join('')}</div>
    ${D.cap ? `<p class="muted">Salary ${p.ovr} OVR · cap room after this pick: ${D.cap - capUsed() - p.ovr}</p>` : ''}
    ${why ? `<p class="why">${esc(why)}</p>` : ''}
    <button class="abtn primary block" data-action="pick" data-i="${i}" id="draft-btn" ${why ? 'disabled' : ''}>Draft ${esc(shortName(p.name))}</button>`;
}
function sheetTeam() {
  const players = picksPlayers();
  const full = players.length === 5;
  const chem = full ? rateLineup(players, [0, 1, 2].map(() => ({ ovr: curDiff().bench }))).chem : chemistry(players);
  return `<h2 class="sh-title">Your five</h2>
    ${players.length ? `<div class="list">${players.map(p => playerRow(p, { origin: true })).join('')}</div>` : '<div class="empty">No picks yet.</div>'}
    ${capBar()}
    <div><div class="sec">Team fit${players.length ? `<span class="sec-sub">Rating ${f1(lineupRating(players))}</span>` : ''}</div>${fitList(chem.rows, full)}</div>
    <button class="abtn block" data-action="close-sheet">Done</button>`;
}
function sheetDiff() {
  const inRun = S.screen !== 'home';
  const curK = inRun ? S.diffKey : DIFF_KEY;
  return `<h2 class="sh-title">Difficulty</h2>
    <div class="list">${DIFF_KEYS.map(k => {
      const D = DIFFS[k], blocked = inRun ? switchBlock(k) : '';
      return `<button class="opt ${k === curK ? 'on' : ''}" data-action="setdiff" data-k="${k}" ${blocked ? 'disabled' : ''}><b>${D.label}</b><span>${esc(diffRules(D))}</span>${blocked ? `<span class="why">${esc(blocked)}</span>` : ''}</button>`;
    }).join('')}</div>
    ${inRun ? '<p class="fine">Applies from now on. Games already played stay as they are. Your best run records the easiest level you used.</p>' : ''}`;
}
function sheetLeave() {
  return `<h2 class="sh-title">Leave this run?</h2>
    <p class="muted">Your draft, season and playoff progress will be lost.</p>
    <div class="row2"><button class="abtn" data-action="close-sheet">Keep playing</button><button class="abtn danger" data-action="home">Leave</button></div>`;
}
function sheetView() {
  const sh = UI.sheet;
  if (!sh) return '';
  const inner = sh.type === 'player' ? sheetPlayer(sh.i) : sh.type === 'team' ? sheetTeam() : sh.type === 'diff' ? sheetDiff() : sheetLeave();

}

/* ======================= RENDER ======================= */
const VIEWS = { home: viewHome, draft: viewDraft, roster: viewRoster, season: viewSeason, playoffs: viewPlayoffs, end: viewEnd };
// Lock the page behind a sheet by pinning the body, so the page scrollbar stays put (no sideways jump).
let lockY = null;
function setLock(on) {
  const b = document.body.style;
  if (on && lockY === null) {
    lockY = window.scrollY;
    Object.assign(b, { position: 'fixed', top: `-${lockY}px`, left: '0', right: '0' });
  } else if (!on && lockY !== null) {
    Object.assign(b, { position: '', top: '', left: '', right: '' });
    window.scrollTo(0, lockY);
    lockY = null;
  }
}
const THEME_BAR = { rookie: '#091117', pro: '#0C1016', hof: '#100C17' };
function applyTheme() {
  const k = (S && S.diffKey) || DIFF_KEY;
  document.documentElement.dataset.diff = k;
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', THEME_BAR[k]);
}
// Compact the draft dock after scrolling; hysteresis stops it flickering when its height change moves the page.
function updateDock() {
  const y = lockY !== null ? lockY : window.scrollY;
  const next = UI.dockCompact ? y > 8 : y > 60;
  if (next === UI.dockCompact) return;
  UI.dockCompact = next;
  const d = document.getElementById('dock');
  if (d) d.classList.toggle('compact', next);
}
window.addEventListener('scroll', updateDock, { passive: true });
function render() {
  const changed = UI.lastScreen !== S.screen;
  UI.lastScreen = S.screen;
  $('#app').innerHTML = VIEWS[S.screen]() + sheetView() + (UI.toast ? `<div class="toast" role="status">${esc(UI.toast)}</div>` : '');
  setLock(!!UI.sheet);
  applyTheme();
  UI.popSlot = null; UI.landed = false; UI.gameAnim = null; // one-shot animations play on a single render
  if (changed) UI.dockCompact = false;
  updateDock();
  if (changed) {
    window.scrollTo(0, 0);
    const m = $('#main');
    if (m && !reduced()) m.classList.add('enter');
  }
}
function toast(msg) {
  UI.toast = msg;
  const id = ++UI.toastId;
  render();
  setTimeout(() => { if (UI.toastId === id) { UI.toast = ''; const el = $('.toast'); if (el) el.remove(); } }, 1900);
}
function openSheet(sh) { UI.sheet = sh; render(); }
function closeSheet() { UI.sheet = null; render(); }

/* ======================= TRANSITIONS ======================= */
// Full-screen wipe: slab covers the screen, the new screen renders underneath, the title holds, then the slab exits.
// It always plays in full; it is part of the game, not a loading cover. Under reduced motion the slabs fade instead of sliding.
function playTransition(cfg, swap, after) {
  const coverAt = reduced() ? 280 : 500;
  const el = document.createElement('div');
  el.className = 'wipe' + (cfg.tone === 'loss' ? ' loss' : '');
  el.setAttribute('role', 'status');
  el.innerHTML = `<div class="slab dark"></div><div class="slab lit"><div class="wipe-in">
    ${cfg.kicker ? `<span class="kicker">${esc(cfg.kicker)}</span>` : ''}<b class="${cfg.title.length > 10 ? 'long' : ''}">${esc(cfg.title)}</b>${cfg.sub ? `<span class="sub">${esc(cfg.sub)}</span>` : ''}${cfg.note ? `<span class="note">${esc(cfg.note)}</span>` : ''}
    </div></div>`;
  document.body.appendChild(el);
  let swapped = false, done = false;
  const doSwap = () => { if (!swapped) { swapped = true; swap(); } };
  const finish = () => {
    if (done) return;
    done = true; doSwap();
    el.classList.add('out');
    setTimeout(() => { el.remove(); if (after) after(); }, 480);
  };
  setTimeout(doSwap, coverAt);
  setTimeout(finish, coverAt + (cfg.hold || 750));
  el.addEventListener('click', e => e.stopPropagation()); // the overlay holds input until the transition ends
}

/* ======================= ACTIONS ======================= */
let timer = null;
function stopTimer() { if (timer) { clearTimeout(timer); timer = null; } }

function goHome() { stopTimer(); UI.sheet = null; S = { screen: 'home' }; render(); }

function startDraft() {
  stopTimer();
  UI.sheet = null;
  S = { screen: 'draft', diffKey: DIFF_KEY, minDiff: DIFF_KEYS.indexOf(DIFF_KEY), draft: { picks: [], rolled: null, rerolls: DIFFS[DIFF_KEY].rerolls, usedTeams: [], spinning: false } };
  const D = DIFFS[DIFF_KEY];
  playTransition({ kicker: D.label, title: 'Draft day', sub: `Five rolls · ${D.rerolls} reroll${D.rerolls === 1 ? '' : 's'}${D.cap ? ` · ${D.cap} OVR cap` : ''}` }, render);
}

function roll() {
  const d = S.draft;
  if (d.spinning) return;
  const pos = slotPos(), max = maxPickOvr(curDiff(), d.picks), taken = takenNames();
  const avail = TEAMS.filter(t => !d.usedTeams.includes(t.id) && t.players.some(p => p.pos === pos && p.ovr <= max && !taken.has(p.name)));
  const era = pick(ERAS.filter(e => avail.some(t => t.era === e)));
  const target = pick(avail.filter(t => t.era === era));
  d.usedTeams.push(target.id);
  const finish = () => { stopTimer(); d.spinning = false; d.rolled = target.id; UI.landed = true; render(); };
  if (reduced()) { finish(); return; }
  d.spinning = true; d.rolled = null; render();
  let step = 0;
  const STEPS = 24, ERA_LOCK = 11, SEASON_LOCK = 18;
  const lock = el => { const r = el.parentElement; r.classList.remove('spin'); r.classList.add('lock'); };
  const tick = () => {
    step++;
    const eEl = $('#reelEra'), sEl = $('#reelSeason'), tEl = $('#reelTeam');
    if (!eEl) return;
    const shownEra = step >= ERA_LOCK ? era : pick(ERAS);
    const fake = pick(TEAMS.filter(t => t.era === shownEra));
    eEl.textContent = shownEra;
    sEl.textContent = step >= SEASON_LOCK ? target.season : fake.season;
    tEl.textContent = fake.name;
    if (step === ERA_LOCK) lock(eEl);       // era stamps first
    if (step === SEASON_LOCK) lock(sEl);    // then the season
    if (step < STEPS) timer = setTimeout(tick, 45 + step * step * 0.9);
    else finish();                          // the team stamps on the final render
  };
  timer = setTimeout(tick, 40);
}

function draftPick(i) {
  const d = S.draft;
  if (d.rolled == null) return;
  const p = TEAMS[d.rolled].players[i];
  if (pickBlock(p)) return;
  d.picks.push({ t: d.rolled, i });
  d.rolled = null;
  const srcEl = document.getElementById('sheet-ovr');
  const from = srcEl ? srcEl.getBoundingClientRect() : null;
  UI.sheet = null;
  const n = d.picks.length;
  UI.incoming = n - 1;   // the slot is filled but hidden until the badge lands in it
  render();
  flyToSlot(from, n - 1, p, () => {
    UI.incoming = null; UI.popSlot = n - 1; render();
    // Finishing the draft ends a stage, so that one gets the full stage card.
    if (n === 5) setTimeout(() => {
      if (S.draft !== d || S.screen !== 'draft') return; // the player left this run before the card was due
      S.screen = 'roster';
      playTransition({ kicker: 'Lineup set', title: 'Your five', sub: `${p.name} completes it · team rating ${f1(lineupRating(picksPlayers()))}` }, render);
    }, 450);
  });
}

// Animate a copy of the player's OVR badge from the card he was drafted from into his lineup slot.
function flyToSlot(from, idx, p, done) {
  const ring = document.querySelector(`.s5[data-slot="${idx}"] .ring`);
  if (!from || !ring || reduced() || !document.body.animate) { done(); return; }
  const to = ring.getBoundingClientRect();
  const fly = document.createElement('div');
  fly.className = 'flyer';
  fly.textContent = p.ovr;
  fly.style.setProperty('--era', ERA_INFO[p.era].color);
  Object.assign(fly.style, { left: `${from.left}px`, top: `${from.top}px`, width: `${from.width}px`, height: `${from.height}px` });
  document.body.appendChild(fly);
  const dx = to.left + to.width / 2 - (from.left + from.width / 2);
  const dy = to.top + to.height / 2 - (from.top + from.height / 2);
  const sc = to.width / from.width;
  const anim = fly.animate([
    { transform: 'translate(0, 0) scale(1)', borderRadius: '16px' },
    { transform: `translate(${dx * 0.45}px, ${dy * 0.45 - 46}px) scale(1.22)`, borderRadius: '30%', offset: 0.45 },
    { transform: `translate(${dx}px, ${dy}px) scale(${sc})`, borderRadius: '50%' },
  ], { duration: 620, easing: 'cubic-bezier(.45, 0, .2, 1)', fill: 'forwards' });
  anim.onfinish = () => { fly.remove(); done(); };
}

function startSeason() {
  const taken = takenNames();
  S.user = buildUserTeam(S.draft.picks, curDiff().bench);
  S.league = makeLeague(taken);
  const res = simSeason(S.user, S.league);
  S.season = { games: res.games, acc: res.acc, w: res.w, l: res.l, shown: 0 };
  S.legends = legendsFrom(S.league);
  S.field = seedField(S.user, res.w, S.legends, S.league);
  S.screen = 'season';
  playTransition({ kicker: 'Regular season', title: 'Tip-off', sub: `82 games · projected ${Math.round(expectedWins(S.user, S.league))} wins` }, render, animateSeason);
}

function animateSeason() {
  stopTimer();
  const s = S.season;
  if (reduced()) { s.shown = 82; render(); return; }
  const tick = () => {
    if (S.screen !== 'season') return;
    s.shown = Math.min(82, s.shown + 1);
    const g = s.games[s.shown - 1];
    const strip = $('#strip');
    if (strip) strip.children[s.shown - 1].className = g.won ? 'w' : 'l';
    const set = (id, v, html) => { const el = $(id); if (el) el[html ? 'innerHTML' : 'textContent'] = v; };
    set('#sb-w', g.w); set('#sb-l', g.l); set('#sb-g', `${s.shown} / 82`);
    set('#bar-sub', `${s.shown} of 82 games`); set('#lastgame', lastLine(g), true);
    if (s.shown < 82) timer = setTimeout(tick, 38);
    else { timer = null; render(); }
  };
  timer = setTimeout(tick, 250);
}
function skipSeason() { stopTimer(); S.season.shown = 82; render(); }

function startPlayoffs() {
  const boost = curDiff().boost;
  S.field.forEach(e => { if (!e.team.user) { e.base = e.team.rating; e.team = { ...e.team, rating: e.base + boost }; } });
  const bySeed = {};
  S.field.forEach(e => bySeed[e.seed] = e);
  const slots = BRACKET_ORDER.map(sd => bySeed[sd]);
  const r0 = [];
  for (let i = 0; i < 16; i += 2) r0.push(newSeries(slots[i], slots[i + 1]));
  S.po = { round: 0, rounds: [r0], plan: null, norm: traitNorm(S.field.filter(e => !e.team.user).map(e => e.team)) };
  UI.tab = 'plan';
  S.screen = 'playoffs';
  const s = userSeries(), you = s.a.team.user ? s.a : s.b, opp = s.a.team.user ? s.b : s.a;
  playTransition({ kicker: 'The gauntlet', title: 'Playoffs', sub: `Seed #${you.seed} · Round of 16 vs ${opp.team.label}` }, render);
}

function playUserGame(s) {
  const P = S.po;
  const plan = PLANS.find(x => x.k === P.plan);
  if (!plan || s.done) return;
  const youA = s.a.team.user;
  const you = youA ? s.a : s.b, opp = youA ? s.b : s.a;
  const eff = planEffect(plan, vulnerability(opp.team, P.norm), execution(you.team), repeatsFor(s, plan.k));
  const rec = youA ? playSeriesGame(s, eff, 0) : playSeriesGame(s, 0, eff);
  rec.plan = plan.k; rec.eff = eff;
}
function seriesScore(s) { const youA = s.a.team.user; return [youA ? s.wa : s.wb, youA ? s.wb : s.wa]; }
function playGame() {
  const s = userSeries(); if (!s) return;
  playUserGame(s);
  UI.tab = 'plan';
  const g = s.games[s.games.length - 1], r = gameLine(s, g), [yw, ow] = seriesScore(s);
  if (!s.done) { UI.gameAnim = r.won ? 'w' : 'l'; render(); return; }   // a single game animates in place
  const won = s.winner.team.user;                                        // a clinching game ends the series: stage card
  playTransition({ kicker: `${ROUND_NAMES[S.po.round]} · Game ${g.n} · ${r.score}`, title: won ? 'Series won' : 'Series lost', sub: `${yw}–${ow} vs the ${(s.a.team.user ? s.b : s.a).team.label}`, note: r.plan ? `Game plan: ${r.plan}` : '', tone: won ? '' : 'loss', hold: 900 }, render);
}
function simSeries() {
  const s = userSeries(); if (!s) return;
  const before = s.games.length;
  while (!s.done) playUserGame(s);
  UI.tab = 'games';
  const [yw, ow] = seriesScore(s), won = s.winner.team.user;
  playTransition({ kicker: `${ROUND_NAMES[S.po.round]} · simulated ${s.games.length - before} game${s.games.length - before === 1 ? '' : 's'}`, title: won ? 'Series won' : 'Series lost', sub: `${yw}–${ow} vs the ${(s.a.team.user ? s.b : s.a).team.label}`, tone: won ? '' : 'loss', hold: 900 }, render);
}

function userPlayoffAcc() {
  const acc = {};
  S.user.starters.forEach(p => acc[p.name] = newAcc());
  let pw = 0, pl = 0;
  S.po.rounds.forEach(rs => rs.forEach(s => {
    const youA = s.a.team.user, youB = s.b.team.user;
    if (!youA && !youB) return;
    s.games.forEach(g => {
      (youA ? g.aBox : g.bBox).slice(0, 5).forEach(l => addLine(acc[l.p.name], l));
      const yp = youA ? g.aPts : g.bPts, op = youA ? g.bPts : g.aPts;
      yp > op ? pw++ : pl++;
    });
  }));
  return { acc, pw, pl };
}
function nextRound(rs) {
  const winners = rs.map(s => s.winner);
  const next = [];
  for (let i = 0; i < winners.length; i += 2) {
    const [x, y] = winners[i].seed < winners[i + 1].seed ? [winners[i], winners[i + 1]] : [winners[i + 1], winners[i]];
    next.push(newSeries(x, y));
  }
  return next;
}
function advance() {
  const P = S.po;
  const rs = P.rounds[P.round];
  rs.forEach(finishSeries);
  const us = rs.find(s => s.a.team.user || s.b.team.user);
  if (!us.winner.team.user) {
    let r = P.round;
    while (r < 3) { const next = nextRound(P.rounds[r]); next.forEach(finishSeries); P.rounds.push(next); r++; }
    const champE = P.rounds[3][0].winner;
    const yw = us.a.team.user ? us.wa : us.wb, ow = us.a.team.user ? us.wb : us.wa;
    const { acc, pw, pl } = userPlayoffAcc();
    const finish = ['Out in the Round of 16', 'Out in the Quarterfinals', 'Out in the Semifinals', 'Lost the Finals'][P.round];
    S.end = { champion: false, finish, by: us.winner.team.label, score: `${ow}–${yw}`, champLabel: champE.team.label, acc, pw, pl };
    finalizeRun(P.round);
    return;
  }
  if (P.round === 3) {
    const { acc, pw, pl } = userPlayoffAcc();
    const fmvp = S.user.starters.slice().sort((a, b) => acc[b.name].gs - acc[a.name].gs)[0];
    const beat = P.rounds.map(rs2 => { const s = rs2.find(x => x.a.team.user || x.b.team.user); return (s.a.team.user ? s.b : s.a).team.short; });
    S.end = { champion: true, finish: 'Champions', beat, fmvp: fmvp.name, acc, pw, pl };
    finalizeRun(4);
    return;
  }
  P.rounds.push(nextRound(rs));
  P.round++;
  P.plan = null;
  UI.tab = 'plan';
  UI.lastScreen = null; // replay the screen transition for the new round
  const s = userSeries(), opp = s.a.team.user ? s.b : s.a;
  playTransition({ kicker: `Won ${us.a.team.user ? us.wa : us.wb}–${us.a.team.user ? us.wb : us.wa}`, title: P.round === 3 ? 'The Finals' : ROUND_NAMES[P.round], sub: `vs ${opp.team.label} · seed ${opp.seed}` }, render);
}
function finalizeRun(level) {
  const five = S.user.starters.map(p => shortName(p.name)).join(', ');
  const idx = S.minDiff ?? DIFF_KEYS.indexOf(S.diffKey);
  saveBest({ level, finish: S.end.finish, w: S.season.w, l: S.season.l, five, diff: DIFFS[DIFF_KEYS[idx]].label, diffIdx: idx });
  S.screen = 'end';
  const E = S.end;
  playTransition(E.champion
    ? { kicker: 'Your Five', title: 'Champions', sub: `Finals MVP: ${E.fmvp}`, hold: 1300 }
    : { kicker: 'Season over', title: 'Eliminated', sub: `${E.finish} · lost ${E.score.split('–').reverse().join('–')} to the ${E.by}`, tone: 'loss', hold: 1000 }, render);
}

function applyDiff(k) {
  const old = S.diffKey || DIFF_KEY;
  DIFF_KEY = k; saveDiff(k);
  UI.sheet = null;
  if (!S.diffKey) { render(); return; }
  if (S.draft) {
    const used = DIFFS[old].rerolls - S.draft.rerolls;
    S.draft.rerolls = Math.max(0, DIFFS[k].rerolls - used);
  }
  S.diffKey = k;
  S.minDiff = Math.min(S.minDiff ?? DIFF_KEYS.indexOf(old), DIFF_KEYS.indexOf(k));
  if (S.user) {
    const nu = buildUserTeam(S.draft.picks, DIFFS[k].bench);
    if (S.field) S.field.forEach(e => { if (e.team.user) e.team = nu; });
    S.user = nu;
  }
  if (S.po) S.field.forEach(e => { if (!e.team.user && e.base != null) e.team = { ...e.team, rating: e.base + DIFFS[k].boost }; });
  toast(`Difficulty: ${DIFFS[k].label}`);
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b || b.disabled) return;
  const a = b.dataset.action;
  if (a === 'start') startDraft();
  else if (a === 'home') goHome();
  else if (a === 'leave') { if (S.screen === 'end' || S.screen === 'home') goHome(); else openSheet({ type: 'leave' }); }
  else if (a === 'diff') { DIFF_KEY = b.dataset.k; saveDiff(DIFF_KEY); render(); }
  else if (a === 'homeEra') { UI.homeEra = b.dataset.era; render(); }
  else if (a === 'sheet') openSheet({ type: b.dataset.sheet });
  else if (a === 'sheet-player') openSheet({ type: 'player', i: +b.dataset.i });
  else if (a === 'close-sheet') closeSheet();
  else if (a === 'setdiff') applyDiff(b.dataset.k);
  else if (a === 'roll') roll();
  else if (a === 'reroll') { if (S.draft.rerolls > 0 && S.draft.rolled != null) { S.draft.rerolls--; S.draft.rolled = null; roll(); } }
  else if (a === 'pick') draftPick(+b.dataset.i);
  else if (a === 'season') startSeason();
  else if (a === 'skip') skipSeason();
  else if (a === 'playoffs') startPlayoffs();
  else if (a === 'tab') { UI.tab = b.dataset.tab; render(); }
  else if (a === 'plan') { S.po.plan = b.dataset.k; render(); }
  else if (a === 'game') playGame();
  else if (a === 'simseries') simSeries();
  else if (a === 'advance') advance();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && UI.sheet) closeSheet();
});

/* ======================= BOOT ======================= */
function start(data) {
  if (data && data.S && data.S.screen) {
    S = data.S;
    if (S.draft) S.draft.spinning = false;
    if (S.screen === 'season' && S.season) S.season.shown = 82;
  }
  render();
}
if (window.claude && window.claude.hot) {
  try { window.claude.hot.snapshot(() => ({ S })); } catch (e) { /* hot reload unavailable */ }
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body>
