<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Era Roll Basketball</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Big+Shoulders+Display:wght@600;800;900&family=Chivo+Mono:wght@400;600&display=swap">
<style>
  /* Layout: an arena at night. A maple-floor hero, then scoreboard panels on blue-black.
     Single dark look by choice: the floor and the LED board read the same on any host theme. */
  :root {
    --night:   #0C1016;
    --panel:   #151B24;
    --panel-2: #1C2430;
    --line:    #2A3341;
    --chalk:   #ECEFF3;
    --muted:   #95A1B2;
    --faint:   #5F6B7C;
    --maple:   #D59C60;
    --maple-2: #BF8247;
    --maple-3: #C98F55;
    --floor-ink: #22150A;
    --court-line: rgba(255, 250, 240, 0.62);
    --led:     #FFB627;
    --led-dim: #5A4517;
    --win:     #45C482;
    --loss:    #E65B50;
    --e80: #2EC4B6;
    --e90: #B583FF;
    --e00: #4EA8FF;
    --e10: #FF7A59;
    --e20: #F2689F;

    --display: "Big Shoulders Display", Impact, "Arial Narrow", sans-serif;
    --body: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "Chivo Mono", ui-monospace, Menlo, Consolas, monospace;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { background: var(--night); color: var(--chalk); }
  body {
    margin: 0;
    font-family: var(--body);
    font-size: 15px;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { cursor: not-allowed; }
  :focus-visible { outline: 2px solid var(--led); outline-offset: 2px; }
  h1, h2, h3 { text-wrap: balance; margin: 0; }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  .wrap {
    max-width: 1100px;
    margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  /* ---------- buttons & chips ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: 0; border-radius: 6px;
    padding: 12px 22px;
    font-family: var(--display); font-weight: 800; font-size: 20px;
    letter-spacing: 0.06em; text-transform: uppercase; line-height: 1;
    background: var(--led); color: var(--night);
    transition: transform .12s ease, filter .12s ease;
  }
  .btn:hover:not(:disabled) { filter: brightness(1.08); transform: translateY(-1px); }
  .btn:disabled { opacity: .4; }
  .btn.ghost { background: transparent; color: var(--chalk); box-shadow: inset 0 0 0 1.5px var(--line); }
  .btn.ghost:hover:not(:disabled) { box-shadow: inset 0 0 0 1.5px var(--muted); }
  .btn.small { font-size: 16px; padding: 9px 14px; }
  .btn.dark { background: var(--floor-ink); color: var(--led); }

  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted);
    white-space: nowrap;
  }
  .chip.era { border-color: var(--era, var(--line)); color: var(--era, var(--muted)); }
  .eyebrow {
    font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--muted);
  }

  /* ---------- home: the floor ---------- */
  .floor {
    position: relative; overflow: hidden;
    color: var(--floor-ink);
    background:
      linear-gradient(180deg, rgba(255,240,215,.16), rgba(0,0,0,.10)),
      repeating-linear-gradient(90deg, transparent 0 57px, rgba(70,35,8,.20) 57px 58px),
      repeating-linear-gradient(90deg, var(--maple) 0 174px, var(--maple-2) 174px 290px, var(--maple-3) 290px 406px, var(--maple) 406px 580px);
    border-bottom: 6px solid var(--floor-ink);
  }
  .floor svg.court { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .floor .wrap { position: relative; padding-block: 48px 56px; display: grid; gap: 32px; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: center; }
  .site-link {
    position: absolute; top: 16px; left: max(16px, env(safe-area-inset-left, 0px));
    font-family: var(--display); font-weight: 800; font-size: 14px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--floor-ink); text-decoration: none; opacity: .75;
  }
  .site-link:hover { opacity: 1; }
  .logo {
    font-family: var(--display); font-weight: 900;
    font-size: clamp(76px, 15vw, 176px);
    line-height: .82; letter-spacing: -.01em; text-transform: uppercase;
  }
  .logo span { display: block; }
  .logo .sub {
    font-size: .26em; letter-spacing: .32em; font-weight: 800; margin-top: .45em; padding-left: .08em;
  }
  .tagline { font-size: 19px; font-weight: 500; max-width: 30ch; margin: 22px 0 26px; line-height: 1.4; }
  .hero-actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .hero-meta { font-size: 13px; font-weight: 600; letter-spacing: .04em; opacity: .8; }

  /* scoreboard (LED) */
  .board {
    background: #090B0F; border-radius: 12px; padding: 18px;
    box-shadow: 0 0 0 4px var(--floor-ink), 0 24px 50px rgba(0,0,0,.35);
    color: var(--led);
  }
  .board .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .reel {
    background: #12100A; border-radius: 6px; padding: 10px 12px; min-width: 0;
    box-shadow: inset 0 0 0 1px #2B2410;
  }
  .reel .k { font-family: var(--display); font-weight: 700; font-size: 12px; letter-spacing: .2em; color: #A47A1D; }
  .reel .v {
    font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1.05; text-transform: uppercase;
    text-shadow: 0 0 12px rgba(255, 182, 39, .45);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .reel.wide { grid-column: 1 / -1; }
  .reel.spin .v { animation: flick .08s steps(2) infinite; }
  @keyframes flick { 50% { opacity: .55; } }
  .board .foot { margin-top: 12px; display: flex; justify-content: space-between; gap: 10px; font-family: var(--mono); font-size: 12px; color: #A47A1D; flex-wrap: wrap; }

  /* ---------- home: below floor ---------- */
  .home-body { padding-block: 40px 56px; display: grid; gap: 44px; }
  .steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
  .step { padding: 16px 16px 18px; border-top: 3px solid var(--led); background: var(--panel); border-radius: 0 0 8px 8px; }
  .step .n { font-family: var(--display); font-weight: 900; font-size: 34px; color: var(--led); line-height: 1; }
  .step h3 { font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: .03em; text-transform: uppercase; margin: 6px 0 4px; }
  .step p { margin: 0; color: var(--muted); font-size: 14px; }

  .sec-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .sec-head h2 { font-family: var(--display); font-weight: 800; font-size: 34px; text-transform: uppercase; letter-spacing: .02em; line-height: 1; }
  .sec-head p { margin: 4px 0 0; color: var(--muted); max-width: 60ch; }

  .eras { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
  .era-col { display: grid; gap: 8px; align-content: start; }
  .era-col h3 { font-family: var(--display); font-weight: 900; font-size: 28px; color: var(--era); line-height: 1; padding-bottom: 6px; border-bottom: 2px solid var(--era); }
  .legend {
    background: var(--panel); border-radius: 8px; padding: 10px 12px; display: grid; gap: 2px;
  }
  .legend .t { font-weight: 700; font-size: 14px; line-height: 1.25; }
  .legend .s { font-size: 12px; color: var(--muted); }
  .legend .r { font-family: var(--mono); font-size: 12px; color: var(--led); }

  .best { display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: baseline; background: var(--panel); border-radius: 8px; padding: 14px 16px; }
  .best b { font-family: var(--display); font-size: 24px; font-weight: 800; letter-spacing: .02em; text-transform: uppercase; color: var(--led); }
  .fine { color: var(--faint); font-size: 12px; max-width: 70ch; }

  /* ---------- game shell ---------- */
  .topbar { border-bottom: 1px solid var(--line); background: var(--panel); }
  .topbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; flex-wrap: wrap; }
  .mark { font-family: var(--display); font-weight: 900; font-size: 24px; letter-spacing: .02em; text-transform: uppercase; color: var(--led); background: none; border: 0; padding: 0; }
  .progress { display: flex; gap: 4px; flex-wrap: wrap; }
  .progress span {
    font-family: var(--display); font-weight: 700; font-size: 14px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--faint); padding: 4px 10px; border-radius: 4px;
  }
  .progress span.on { color: var(--night); background: var(--led); }
  .progress span.done { color: var(--muted); }
  .screen { padding-block: 26px 64px; display: grid; gap: 22px; }
  .screen h1 { font-family: var(--display); font-weight: 900; font-size: clamp(36px, 6vw, 56px); text-transform: uppercase; line-height: .95; }
  .lede { color: var(--muted); margin: 6px 0 0; max-width: 62ch; }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
  .panel > h2 { font-family: var(--display); font-weight: 800; font-size: 22px; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 10px; }

  /* draft layout */
  .draft-grid { display: grid; grid-template-columns: minmax(0, 330px) minmax(0, 1fr); gap: 18px; align-items: start; }
  .slots { display: grid; gap: 8px; }
  .slot {
    display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 10px; align-items: center;
    background: var(--panel-2); border-radius: 8px; padding: 8px 10px; min-height: 58px;
  }
  .slot.empty { background: transparent; border: 1.5px dashed var(--line); color: var(--faint); }
  .slot .who { min-width: 0; }
  .slot .who b { display: block; font-size: 14px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .slot .who small { color: var(--muted); font-size: 12px; }
  .ovr {
    font-family: var(--display); font-weight: 900; font-size: 24px; line-height: 1;
    width: 44px; height: 44px; display: grid; place-items: center; border-radius: 8px;
    background: #090B0F; color: var(--led); text-shadow: 0 0 10px rgba(255,182,39,.4);
  }
  .ovr.big { width: 54px; height: 54px; font-size: 30px; }
  .meter { margin-top: 14px; display: grid; gap: 6px; }
  .meter .bar { height: 8px; background: var(--panel-2); border-radius: 99px; overflow: hidden; }
  .meter .bar i { display: block; height: 100%; background: var(--led); border-radius: 99px; transition: width .4s ease; }
  .meter .lab { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
  .meter .lab b { color: var(--chalk); font-family: var(--mono); }
  .notes { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 13px; }
  .notes li { padding-left: 14px; position: relative; color: var(--muted); }
  .notes li::before { content: ""; position: absolute; left: 0; top: .55em; width: 6px; height: 6px; border-radius: 50%; background: var(--win); }
  .notes li.bad::before { background: var(--loss); }

  .rollbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
  .rollbar .hint { color: #A47A1D; font-family: var(--mono); font-size: 12px; }

  /* player cards */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 10px; }
  .pcard {
    text-align: left; display: grid; gap: 10px;
    background: var(--panel-2); border: 1.5px solid transparent; border-radius: 10px; padding: 12px;
    transition: border-color .12s ease, transform .12s ease;
  }
  button.pcard:hover:not(:disabled) { border-color: var(--led); transform: translateY(-2px); }
  .pcard:disabled { opacity: .38; }
  .pcard .top { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: center; }
  .pcard .nm { font-weight: 700; font-size: 15px; line-height: 1.2; }
  .pcard .meta { font-size: 12px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; margin-top: 3px; align-items: center; }
  .statrow { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 2px; text-align: center; background: var(--panel); border-radius: 6px; padding: 6px 2px; }
  .statrow div { min-width: 0; }
  .statrow b { display: block; font-family: var(--mono); font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; }
  .statrow span { display: block; font-size: 10px; letter-spacing: .1em; color: var(--faint); font-weight: 700; }
  .pcard .why { font-size: 12px; color: var(--loss); font-weight: 600; }

  /* tables */
  .tbl-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { padding: 8px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
  th { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); font-weight: 700; }
  td { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child { text-align: left; font-family: var(--body); }
  td:first-child b { font-weight: 700; }
  td:first-child small { color: var(--muted); margin-left: 6px; }

  /* season */
  .scoreboard {
    background: #090B0F; border-radius: 12px; padding: 16px 18px; color: var(--led);
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-items: end;
    box-shadow: inset 0 0 0 1px #2B2410;
  }
  .scoreboard .k { font-family: var(--display); font-weight: 700; font-size: 12px; letter-spacing: .2em; color: #A47A1D; }
  .scoreboard .v { font-family: var(--display); font-weight: 900; font-size: clamp(40px, 8vw, 68px); line-height: .9; text-shadow: 0 0 16px rgba(255,182,39,.45); font-variant-numeric: tabular-nums; }
  .scoreboard .v.sm { font-size: clamp(20px, 3vw, 26px); line-height: 1.1; }
  .strip { display: grid; grid-template-columns: repeat(41, minmax(0, 1fr)); gap: 3px; }
  .strip i { aspect-ratio: 1; border-radius: 2px; background: var(--panel-2); max-width: 100%; }
  .strip i.w { background: var(--win); }
  .strip i.l { background: var(--loss); }
  .lastgame { font-family: var(--mono); font-size: 13px; color: var(--muted); min-height: 1.5em; }
  .lastgame .W { color: var(--win); font-weight: 600; }
  .lastgame .L { color: var(--loss); font-weight: 600; }
  .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
  .facts { display: grid; gap: 10px; }
  .fact { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 10px; font-size: 14px; }
  .fact span { color: var(--faint); font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding-top: 2px; }
  .award { display: inline-block; margin: 0 6px 6px 0; }

  /* playoffs */
  .bracket-wrap { overflow-x: auto; padding-bottom: 6px; }
  .bracket { display: grid; grid-template-columns: repeat(4, minmax(170px, 1fr)); gap: 14px; min-width: 740px; }
  .bcol { display: flex; flex-direction: column; justify-content: space-around; gap: 8px; }
  .bcol h3 { font-family: var(--display); font-weight: 800; font-size: 15px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
  .match { background: var(--panel-2); border-radius: 6px; overflow: hidden; font-size: 13px; }
  .match .tm { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 6px; padding: 5px 8px; align-items: center; }
  .match .tm + .tm { border-top: 1px solid var(--line); }
  .match .sd { font-family: var(--mono); font-size: 11px; color: var(--faint); }
  .match .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .match .w { font-family: var(--mono); color: var(--muted); }
  .match .tm.win .nm { font-weight: 700; }
  .match .tm.win .w { color: var(--led); }
  .match .tm.lose { opacity: .5; }
  .match .tm.you .nm { color: var(--led); }
  .match.tbd { opacity: .5; }

  .series-head { display: flex; justify-content: space-between; gap: 14px; flex-wrap: wrap; align-items: center; }
  .vs { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 14px; align-items: center; background: #090B0F; border-radius: 12px; padding: 16px; }
  .vs .side { min-width: 0; }
  .vs .side.r { text-align: right; }
  .vs .tn { font-family: var(--display); font-weight: 800; font-size: clamp(18px, 3vw, 26px); text-transform: uppercase; line-height: 1.05; }
  .vs .sub { font-size: 12px; color: var(--muted); }
  .vs .sc { font-family: var(--display); font-weight: 900; font-size: clamp(44px, 8vw, 72px); color: var(--led); line-height: .9; text-shadow: 0 0 16px rgba(255,182,39,.45); font-variant-numeric: tabular-nums; }
  .games { display: grid; gap: 6px; }
  .game {
    display: grid; grid-template-columns: 64px 26px minmax(0, 1fr); gap: 10px; align-items: center;
    background: var(--panel-2); border-radius: 6px; padding: 8px 10px; font-size: 13px;
  }
  .game .g { font-family: var(--display); font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .game .res { font-family: var(--display); font-weight: 900; font-size: 18px; }
  .game .res.W { color: var(--win); }
  .game .res.L { color: var(--loss); }
  .game .line { font-family: var(--mono); font-size: 12px; color: var(--muted); min-width: 0; }
  .game .line b { color: var(--chalk); font-weight: 600; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  details.scout summary { cursor: pointer; font-weight: 700; color: var(--muted); font-size: 14px; }
  details.scout[open] summary { margin-bottom: 10px; }

  /* end */
  .banner {
    border-radius: 12px; padding: 28px 22px; text-align: center; color: var(--floor-ink);
    background:
      repeating-linear-gradient(90deg, transparent 0 57px, rgba(70,35,8,.2) 57px 58px),
      repeating-linear-gradient(90deg, var(--maple) 0 174px, var(--maple-2) 174px 290px, var(--maple-3) 290px 406px, var(--maple) 406px 580px);
  }
  .banner .big { font-family: var(--display); font-weight: 900; font-size: clamp(48px, 10vw, 104px); line-height: .85; text-transform: uppercase; }
  .banner p { font-weight: 600; margin: 10px auto 0; max-width: 52ch; }
  .banner.out { background: var(--panel-2); color: var(--chalk); }
  .banner.out .big { color: var(--loss); }

  @media (max-width: 900px) {
    .floor .wrap { grid-template-columns: minmax(0, 1fr); padding-top: 56px; }
    .steps { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .eras { grid-template-columns: repeat(auto-fill, minmax(min(100%, 190px), 1fr)); }
    .draft-grid, .two { grid-template-columns: minmax(0, 1fr); }
    .draft-grid > aside { order: 2; }
  }
  @media (max-width: 520px) {
    .steps { grid-template-columns: minmax(0, 1fr); }
    .reel .v { font-size: 24px; }
    .strip { grid-template-columns: repeat(21, minmax(0, 1fr)); }
    .scoreboard { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .scoreboard > div:last-child { grid-column: 1 / -1; }
    .game { grid-template-columns: 50px 22px minmax(0, 1fr); }
    .fact { grid-template-columns: minmax(0, 1fr); gap: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ======================= DATA ======================= */
/* Approximate regular-season averages. Row: [name, pos, PTS, REB, AST, STL, BLK, FG%, OVR] */
const ERA_INFO = {
  '1980s': { pace: 110, color: 'var(--e80)' },
  '1990s': { pace: 101, color: 'var(--e90)' },
  '2000s': { pace: 97,  color: 'var(--e00)' },
  '2010s': { pace: 104, color: 'var(--e10)' },
  '2020s': { pace: 114, color: 'var(--e20)' },
};
const ERAS = Object.keys(ERA_INFO);

const RAW = [
  ['1980s', '1985-86', 'Boston Celtics', [
    ['Larry Bird','SF',25.8,9.8,6.8,2.0,0.6,49.6,97],
    ['Kevin McHale','PF',21.3,8.1,2.7,0.4,2.0,57.4,90],
    ['Robert Parish','C',16.1,9.5,1.8,0.9,1.4,54.9,86],
    ['Dennis Johnson','PG',15.6,3.4,5.8,1.4,0.4,45.5,84],
    ['Danny Ainge','SG',10.7,2.9,5.1,1.2,0.1,50.4,80],

/* ======================= ENGINE ======================= */
const BENCH_OVR_USER = 74;
const FILL_OVR = 72;
const HOME_EDGE = 1.5;
const MARGIN_SD = 12;
const MARGIN_K = 1.1;

const rand = () => Math.random();
const pick = arr => arr[Math.floor(rand() * arr.length)];
function normal() {
  let u = 0, v = 0;
  while (u === 0) u = rand();
  while (v === 0) v = rand();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function Phi(x) { // standard normal CDF
  const t = 1 / (1 + 0.2316419 * Math.abs(x));
  const d = 0.3989423 * Math.exp(-x * x / 2);
  const p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274))));
  return x > 0 ? 1 - p : p;
}
const avg = arr => arr.reduce((s, x) => s + x, 0) / (arr.length || 1);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

function teamLabel(t) { return `${t.season} ${t.name}`; }
function teamShort(t) { return `’${t.season.slice(-2)} ${t.nick}`; }

function filler(n) {
  return { name: 'Reserve', pos: 'SF', pts: 4, reb: 2.5, ast: 1, stl: 0.4, blk: 0.2, fg: 44, ovr: FILL_OVR, generic: true, n };
}

function chemistry(starters) {
  const guards = starters.filter(p => p.pos === 'PG' || p.pos === 'SG').length;
  const bigs = starters.filter(p => p.pos === 'PF' || p.pos === 'C').length;
  const pg = starters.some(p => p.pos === 'PG');
  const out = { bonus: 0, notes: [] };
  if (starters.length < 5) return out;
  if (guards === 0) { out.bonus -= 3; out.notes.push({ bad: true, t: 'No guards: −3.0 for ball handling' }); }
  else if (!pg) { out.bonus -= 1; out.notes.push({ bad: true, t: 'No point guard: −1.0 for playmaking' }); }
  if (bigs === 0) { out.bonus -= 3; out.notes.push({ bad: true, t: 'No bigs: −3.0 for rebounding and rim protection' }); }
  if (guards >= 4) { out.bonus -= 1.5; out.notes.push({ bad: true, t: 'Four or more guards: −1.5 for size' }); }
  if (bigs >= 4) { out.bonus -= 1.5; out.notes.push({ bad: true, t: 'Four or more bigs: −1.5 for spacing' }); }
  const eras = new Set(starters.map(p => p.era));
  if (eras.size === 1) { out.bonus += 1; out.notes.push({ t: 'All five from one era: +1.0 chemistry' }); }
  if (out.notes.length === 0) out.notes.push({ t: 'Balanced lineup: guards, wings and bigs covered' });
  return out;
}

function rateLineup(starters, bench) {
  const chem = chemistry(starters);
  const r = 0.8 * avg(starters.map(p => p.ovr)) + 0.2 * avg(bench.map(p => p.ovr)) + chem.bonus;
  return { rating: r, chem };
}

function buildRealTeam(t, takenNames) {
  const pool = t.players.filter(p => !takenNames.has(p.name)).slice().sort((a, b) => b.ovr - a.ovr);
  const starters = pool.slice(0, 5);
  const bench = pool.slice(5, 8);
  let k = 0;
  while (bench.length < 3) bench.push(filler(k++));
  const { rating, chem } = rateLineup(starters, bench);
  return {
    key: 't' + t.id, src: t, label: teamLabel(t), short: teamShort(t), era: t.era,
    starters, bench, rating, chem, pace: ERA_INFO[t.era].pace,
  };
}

function buildUserTeam(picks) {
  const starters = picks.map(r => TEAMS[r.t].players[r.i]);
  const bench = [0, 1, 2].map(i => ({ ...filler(i), ovr: BENCH_OVR_USER, pts: 6, reb: 3, ast: 1.5 }));
  const { rating, chem } = rateLineup(starters, bench);
  return {
    key: 'you', user: true, label: 'Your Five', short: 'Your Five', era: 'mixed',
    starters, bench, rating, chem, pace: avg(starters.map(p => ERA_INFO[p.era].pace)),
  };
}

function winProb(a, b, edge) { return Phi(MARGIN_K * (a.rating - b.rating + edge) / MARGIN_SD); }

function expectedWins(team, league) {
  const others = league.filter(o => o.key !== team.key);
  return 82 * avg(others.map(o => winProb(team, o, 0)));
}

function boxScore(team, pts) {
  const roster = team.starters.concat(team.bench);
  const w = roster.map(p => Math.max(0.3, Math.pow(p.pts, 1.15) * (1 + 0.24 * normal())));
  const sw = w.reduce((s, x) => s + x, 0);
  return roster.map((p, i) => {
    const pp = Math.max(0, Math.round(pts * w[i] / sw));
    const fgm = Math.round(pp / 2.35);
    const pct = clamp((p.fg / 100) * (1 + 0.12 * normal()), 0.2, 0.85);
    const fga = Math.max(fgm, Math.round(fgm / pct));
    const cnt = x => Math.max(0, Math.round(x + normal() * Math.sqrt(Math.max(x, 0.2))));
    return {
      p, pts: pp, fgm, fga,
      reb: Math.max(0, Math.round(p.reb * (1 + 0.28 * normal()))),
      ast: Math.max(0, Math.round(p.ast * (1 + 0.3 * normal()))),
      stl: cnt(p.stl), blk: cnt(p.blk),
    };
  });
}

function gameScore(l) { return l.pts + 0.4 * l.fgm - 0.7 * l.fga + 0.7 * l.reb + 0.7 * l.ast + l.stl + 0.7 * l.blk; }

function simGame(home, away) {
  const diff = home.rating - away.rating + HOME_EDGE;
  let m = Math.round(MARGIN_K * diff + MARGIN_SD * normal());
  let ot = false;
  if (m === 0) {
    ot = true;
    const extra = 1 + Math.floor(rand() * 6);
    m = rand() < winProb(home, away, HOME_EDGE) ? extra : -extra;
  }
  const total = home.pace + away.pace + 9 * normal() + (ot ? 10 : 0);
  const hs = Math.round((total + m) / 2);
  const as = hs - m;
  return { home, away, hs, as, ot, hb: boxScore(home, hs), ab: boxScore(away, as) };
}

function newAcc() { return { gp: 0, pts: 0, reb: 0, ast: 0, stl: 0, blk: 0, fgm: 0, fga: 0, hi: 0, gs: 0 }; }
function addLine(acc, l) {
  acc.gp++; acc.pts += l.pts; acc.reb += l.reb; acc.ast += l.ast; acc.stl += l.stl; acc.blk += l.blk;
  acc.fgm += l.fgm; acc.fga += l.fga; acc.hi = Math.max(acc.hi, l.pts); acc.gs += gameScore(l);
}

function makeLeague(takenNames) { return TEAMS.map(t => buildRealTeam(t, takenNames)); }

function legendsFrom(league) {
  const out = [];
  ERAS.forEach(e => {
    league.filter(t => t.era === e).sort((a, b) => b.rating - a.rating).slice(0, 3).forEach(t => out.push(t));
  });
  return out;
}

function simSeason(user, league) {
  let order = [];
  while (order.length < 82) order = order.concat(league.slice().sort(() => rand() - 0.5));
  order = order.slice(0, 82);
  const games = [];
  const acc = {};
  user.starters.forEach(p => acc[p.name] = newAcc());
  let w = 0, l = 0;
  order.forEach((opp, i) => {
    const home = i % 2 === 0;
    const g = home ? simGame(user, opp) : simGame(opp, user);
    const us = home ? g.hs : g.as, them = home ? g.as : g.hs;
    const box = home ? g.hb : g.ab;
    box.slice(0, 5).forEach(line => addLine(acc[line.p.name], line));
    const won = us > them;
    won ? w++ : l++;
    games.push({ opp: opp.key, oppShort: opp.short, oppRating: opp.rating, home, us, them, ot: g.ot, won, w, l });
  });
  return { games, acc, w, l };
}

const BRACKET_ORDER = [1, 16, 8, 9, 5, 12, 4, 13, 3, 14, 6, 11, 7, 10, 2, 15];
const ROUND_NAMES = ['Round of 16', 'Quarterfinals', 'Semifinals', 'Finals'];

function seedField(user, wins, legends, league) {
  const entries = [{ team: user, wins }].concat(legends.map(t => ({ team: t, wins: Math.round(expectedWins(t, league)) })));
  entries.sort((a, b) => b.wins - a.wins || b.team.rating - a.team.rating);
  entries.forEach((e, i) => e.seed = i + 1);
  return entries;
}

function newSeries(a, b) { return { a, b, games: [], wa: 0, wb: 0, done: false, winner: null }; }
const HOME_PATTERN = [0, 0, 1, 1, 0, 1, 0]; // 0 = higher seed (a) at home

function playSeriesGame(s) {
  if (s.done) return null;
  const n = s.games.length;
  const aHome = HOME_PATTERN[n] === 0;
  const g = aHome ? simGame(s.a.team, s.b.team) : simGame(s.b.team, s.a.team);
  const aPts = aHome ? g.hs : g.as, bPts = aHome ? g.as : g.hs;
  const aBox = aHome ? g.hb : g.ab, bBox = aHome ? g.ab : g.hb;
  const rec = { n: n + 1, aHome, aPts, bPts, ot: g.ot, aBox, bBox };
  s.games.push(rec);
  aPts > bPts ? s.wa++ : s.wb++;
  if (s.wa === 4 || s.wb === 4) { s.done = true; s.winner = s.wa === 4 ? s.a : s.b; }
  return rec;
}
function finishSeries(s) { while (!s.done) playSeriesGame(s); }

  }
  let meter = '';
  if (players.length) {
    const bench = [0, 1, 2].map(() => ({ ovr: BENCH_OVR_USER }));
    const { rating, chem } = players.length === 5 ? rateLineup(players, bench) : { rating: 0.8 * avg(players.map(p => p.ovr)) + 0.2 * BENCH_OVR_USER, chem: { notes: [] } };

    meter = `<div class="meter"><div class="lab"><span>${players.length === 5 ? 'Team rating' : 'Rating so far'}</span><b>${f1(rating)}</b></div><div class="bar"><i style="width:${pct}%"></i></div></div>

  }
  return `<div class="slots">${rows.join('')}</div>${meter}`;
}

function bracketView() {
  const P = S.po;
  const cols = [];
  for (let r = 0; r < 4; r++) {
    const series = P.rounds[r];
    const expected = 8 >> r;
    let items = '';
    for (let i = 0; i < expected; i++) {
      const s = series && series[i];
      if (!s) { items += `<div class="match tbd"><div class="tm"><span class="sd"></span><span class="nm">TBD</span><span class="w"></span></div><div class="tm"><span class="sd"></span><span class="nm">TBD</span><span class="w"></span></div></div>`; continue; }
      const show = s.done || s.a.team.user || s.b.team.user;
      const row = (e, wins, other) => {
        const cls = [s.done ? (s.winner === e ? 'win' : 'lose') : '', e.team.user ? 'you' : ''].join(' ');
        return `<div class="tm ${cls}"><span class="sd">${e.seed}</span><span class="nm">${esc(entryName(e))}</span><span class="w">${show ? wins : ''}</span></div>`;
      };
      items += `<div class="match">${row(s.a, s.wa)}${row(s.b, s.wb)}</div>`;
    }
    cols.push(`<div class="bcol"><h3>${ROUND_NAMES[r]}</h3>${items}</div>`);
  }
  return `<div class="bracket-wrap"><div class="bracket">${cols.join('')}</div></div>`;
}

/* ======================= ACTIONS ======================= */
let timer = null;
function stopTimer() { if (timer) { clearTimeout(timer); timer = null; } }

function startDraft() {
  stopTimer();
  S = { screen: 'draft', draft: { picks: [], rolled: null, rerolls: 2, usedTeams: [], spinning: false } };
  render();
  window.scrollTo(0, 0);
}

function roll() {
  const d = S.draft;
  if (d.spinning) return;
  const avail = TEAMS.filter(t => !d.usedTeams.includes(t.id));
  const eras = ERAS.filter(e => avail.some(t => t.era === e));
  const era = pick(eras);
  const target = pick(avail.filter(t => t.era === era));
  d.usedTeams.push(target.id);
  const finish = () => { d.spinning = false; d.rolled = target.id; stopTimer(); render(); };
  if (reduced()) { finish(); return; }
  d.spinning = true; d.rolled = null; render();
  let step = 0;
  const STEPS = 22, ERA_LOCK = 12;
  const tick = () => {
    step++;
    const eEl = $('#reelEra'), sEl = $('#reelSeason'), tEl = $('#reelTeam');
    if (!eEl) return;
    const lockEra = step >= ERA_LOCK;
    const shownEra = lockEra ? era : pick(ERAS);
    const poolT = TEAMS.filter(t => t.era === shownEra);
    const fake = pick(poolT);
    eEl.textContent = shownEra;
    sEl.textContent = fake.season;
    tEl.textContent = fake.name;
    if (lockEra) eEl.parentElement.classList.remove('spin');
    if (step < STEPS) timer = setTimeout(tick, 45 + step * step * 0.9);
    else finish();
  };
  timer = setTimeout(tick, 40);
}

function draftPick(i) {
  const d = S.draft;
  if (d.rolled == null) return;
  const p = TEAMS[d.rolled].players[i];
  if (takenNames().has(p.name)) return;
  d.picks.push({ t: d.rolled, i });
  d.rolled = null;
  if (d.picks.length === 5) S.screen = 'roster';
  render();
  window.scrollTo(0, 0);
}

function startSeason() {
  const taken = takenNames();
  S.user = buildUserTeam(S.draft.picks);
  S.league = makeLeague(taken);
  const res = simSeason(S.user, S.league);
  S.season = { games: res.games, acc: res.acc, w: res.w, l: res.l, shown: 0 };
  S.legends = legendsFrom(S.league);
  S.field = seedField(S.user, res.w, S.legends, S.league);
  S.screen = 'season';
  render();
  window.scrollTo(0, 0);
  animateSeason();
}

function animateSeason() {
  stopTimer();
  const s = S.season;
  if (reduced()) { s.shown = 82; render(); return; }
  const tick = () => {
    if (S.screen !== 'season') return;
    s.shown = Math.min(82, s.shown + 1);
    const g = s.games[s.shown - 1];
    const strip = $('#strip');
    if (strip) strip.children[s.shown - 1].className = g.won ? 'w' : 'l';
    $('#sb-w').textContent = g.w;
    $('#sb-l').textContent = g.l;
    $('#sb-g').textContent = `${s.shown} / 82`;
    $('#lastgame').innerHTML = lastLine(g);
    if (s.shown < 82) timer = setTimeout(tick, 38);
    else { timer = null; render(); }
  };
  timer = setTimeout(tick, 250);
}

function skipSeason() { stopTimer(); S.season.shown = 82; render(); }

function startPlayoffs() {
  const bySeed = {};
  S.field.forEach(e => bySeed[e.seed] = e);
  const slots = BRACKET_ORDER.map(sd => bySeed[sd]);
  const r0 = [];
  for (let i = 0; i < 16; i += 2) r0.push(newSeries(slots[i], slots[i + 1]));
  S.po = { round: 0, rounds: [r0], out: false };
  S.screen = 'playoffs';
  render();
  window.scrollTo(0, 0);
}

function playGame() { const s = userSeries(); if (!s) return; playSeriesGame(s); render(); }
function simSeries() { const s = userSeries(); if (!s) return; finishSeries(s); render(); }

function userPlayoffAcc() {
  const acc = {};
  S.user.starters.forEach(p => acc[p.name] = newAcc());
  let pw = 0, pl = 0;
  S.po.rounds.forEach(rs => rs.forEach(s => {
    const youA = s.a.team.user, youB = s.b.team.user;
    if (!youA && !youB) return;
    s.games.forEach(g => {
      (youA ? g.aBox : g.bBox).slice(0, 5).forEach(l => addLine(acc[l.p.name], l));
      const yp = youA ? g.aPts : g.bPts, op = youA ? g.bPts : g.aPts;
      yp > op ? pw++ : pl++;
    });
  }));
  return { acc, pw, pl };
}

function advance() {
  const P = S.po;
  const rs = P.rounds[P.round];
  rs.forEach(finishSeries);
  const us = rs.find(s => s.a.team.user || s.b.team.user);
  const alive = us && us.winner.team.user;
  if (!alive) {
    // finish the bracket without the user
    let r = P.round;
    while (r < 3) {
      const winners = P.rounds[r].map(s => s.winner);
      const next = [];
      for (let i = 0; i < winners.length; i += 2) {
        const [x, y] = winners[i].seed < winners[i + 1].seed ? [winners[i], winners[i + 1]] : [winners[i + 1], winners[i]];
        next.push(newSeries(x, y));
      }
      next.forEach(finishSeries);
      P.rounds.push(next);
      r++;
    }
    const champE = P.rounds[3][0].winner;
    const opp = us.winner;
    const yw = us.a.team.user ? us.wa : us.wb, ow = us.a.team.user ? us.wb : us.wa;
    const { acc, pw, pl } = userPlayoffAcc();
    const finish = ['Out in the Round of 16', 'Out in the Quarterfinals', 'Out in the Semifinals', 'Lost the Finals'][P.round];
    S.end = { champion: false, finish, by: opp.team.label, score: `${ow}–${yw}`, champLabel: champE.team.user ? 'Your Five' : champE.team.label, acc, pw, pl };
    finalizeRun(P.round);
    return;
  }
  if (P.round === 3) {
    const { acc, pw, pl } = userPlayoffAcc();
    const fmvpP = S.user.starters.slice().sort((a, b) => acc[b.name].gs - acc[a.name].gs)[0];
    const beat = P.rounds.map(rs2 => {
      const s = rs2.find(x => x.a.team.user || x.b.team.user);
      return (s.a.team.user ? s.b : s.a).team.short;
    });
    S.end = { champion: true, finish: 'Champions', beat, fmvp: fmvpP.name, acc, pw, pl };
    finalizeRun(4);
    return;
  }
  const winners = rs.map(s => s.winner);
  const next = [];
  for (let i = 0; i < winners.length; i += 2) {
    const [x, y] = winners[i].seed < winners[i + 1].seed ? [winners[i], winners[i + 1]] : [winners[i + 1], winners[i]];
    next.push(newSeries(x, y));
  }
  P.rounds.push(next);
  P.round++;
  render();
  window.scrollTo(0, 0);
}

function finalizeRun(level) {
  const five = S.user.starters.map(p => p.name.split(' ').slice(-1)[0]).join(', ');
  saveBest({ level, finish: S.end.finish, w: S.season.w, l: S.season.l, five });
  S.screen = 'end';
  render();
  window.scrollTo(0, 0);
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b || b.disabled) return;
  const a = b.dataset.action;
  if (a === 'start') startDraft();
  else if (a === 'home') { stopTimer(); S = { screen: 'home' }; render(); window.scrollTo(0, 0); }
  else if (a === 'roll') roll();
  else if (a === 'reroll') { if (S.draft.rerolls > 0 && S.draft.rolled != null) { S.draft.rerolls--; S.draft.rolled = null; roll(); } }
  else if (a === 'pick') draftPick(+b.dataset.i);
  else if (a === 'season') startSeason();
  else if (a === 'skip') skipSeason();
  else if (a === 'playoffs') startPlayoffs();
  else if (a === 'game') playGame();
  else if (a === 'simseries') simSeries();
  else if (a === 'advance') advance();
});

/* ======================= BOOT ======================= */
function start(data) {
  if (data && data.S && data.S.screen) {
    S = data.S;
    if (S.draft) S.draft.spinning = false;
    if (S.screen === 'season' && S.season) S.season.shown = 82;
  }
  render();
}
if (window.claude && window.claude.hot) {
  try { window.claude.hot.snapshot(() => ({ S })); } catch (e) { /* hot reload unavailable */ }
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
